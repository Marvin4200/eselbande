<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>admin.eselbande.com – Projekt-Dashboard</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #080810;
      --surface:      rgba(255,255,255,0.04);
      --surface2:     rgba(255,255,255,0.07);
      --border:       rgba(255,255,255,0.08);
      --border-hover: rgba(255,255,255,0.14);
      --accent:       #818cf8;
      --accent2:      #667eea;
      --text:         #e2e8f0;
      --muted:        #64748b;
      --danger:       #ef4444;
      --success:      #22c55e;
      --warning:      #f59e0b;
      --discord:      #5865F2;
      --radius:       12px;
    }

    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    body::before {
      content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background: radial-gradient(ellipse at 15% 15%, rgba(102,126,234,.07) 0%, transparent 55%),
                  radial-gradient(ellipse at 85% 85%, rgba(129,140,248,.06) 0%, transparent 55%);
    }
    .wrap { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding: 32px 20px 80px; }

    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; flex-wrap: wrap; gap: 12px; }
    .brand { font-size: 1.3rem; font-weight: 800; }
    .brand span { color: var(--accent); }
    .updated { color: var(--muted); font-size: .8rem; }
    .logout { color: var(--muted); font-size: .85rem; text-decoration: none; border: 1px solid var(--border); padding: 6px 12px; border-radius: 8px; }
    .logout:hover { border-color: var(--border-hover); color: var(--text); }

    .login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; gap: 18px; }
    .login-screen h1 { font-size: 1.6rem; }
    .login-screen p { color: var(--muted); max-width: 380px; }
    .discord-btn {
      display: inline-flex; align-items: center; gap: 10px; background: var(--discord); color: #fff;
      padding: 12px 22px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: .95rem;
    }
    .discord-btn:hover { opacity: .9; }
    .denied { color: var(--danger); }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 18px 20px;
    }
    .card .label { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; margin-bottom: 6px; }
    .card .value { font-size: 1.7rem; font-weight: 800; }
    .card .sub { color: var(--muted); font-size: .8rem; margin-top: 4px; }

    .diskbar { height: 8px; border-radius: 4px; background: var(--surface2); overflow: hidden; margin-top: 10px; }
    .diskbar-fill { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); }
    .diskbar-fill.warn { background: var(--warning); }
    .diskbar-fill.danger { background: var(--danger); }

    section { margin-bottom: 32px; }
    h2 { font-size: 1.1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    h3 { font-size: .9rem; color: var(--muted); margin: 18px 0 8px; text-transform: uppercase; letter-spacing: .03em; }
    .count-pill { font-size: .75rem; color: var(--muted); font-weight: 500; background: var(--surface2); padding: 2px 9px; border-radius: 999px; }

    table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    th, td { text-align: left; padding: 11px 16px; font-size: .87rem; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: .72rem; text-transform: uppercase; letter-spacing: .03em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--surface2); }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    th.num { text-align: right; }
    .truncate { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
    .dot.up { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .dot.down { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
    .dot.unknown { background: var(--muted); }

    .mono { font-family: 'Consolas', monospace; font-size: .82rem; color: var(--muted); }
    .muted { color: var(--muted); }
    .badge { font-size: .72rem; padding: 2px 8px; border-radius: 999px; background: var(--surface2); color: var(--muted); white-space: nowrap; }
    .badge.healthy { background: rgba(34,197,94,.15); color: var(--success); }
    .badge.unhealthy { background: rgba(239,68,68,.15); color: var(--danger); }
    .badge.pub { background: rgba(34,197,94,.15); color: var(--success); }
    .badge.priv { background: rgba(100,116,139,.2); color: var(--muted); }

    .empty { text-align: center; color: var(--muted); padding: 40px; }
    .error-box { background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3); color: var(--danger); padding: 14px 18px; border-radius: var(--radius); margin-bottom: 20px; }

    details.project {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 12px; overflow: hidden;
    }
    details.project[open] { border-color: var(--border-hover); }
    details.project summary {
      list-style: none; cursor: pointer; padding: 16px 20px; display: flex;
      align-items: center; justify-content: space-between; gap: 12px;
    }
    details.project summary::-webkit-details-marker { display: none; }
    .proj-title { font-weight: 700; font-size: 1rem; }
    .proj-summary { color: var(--muted); font-size: .82rem; }
    .chevron { transition: transform .15s; color: var(--muted); flex-shrink: 0; }
    details.project[open] .chevron { transform: rotate(90deg); }
    .proj-body { padding: 4px 20px 20px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 760px) { .two-col { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
  const app = document.getElementById('app');

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function fmtDate(iso) {
    if (!iso) return '–';
    const d = new Date(iso);
    return d.toLocaleString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' });
  }

  function fmtRelative(iso) {
    if (!iso) return '–';
    const diffMs = Date.now() - new Date(iso).getTime();
    const days = Math.floor(diffMs / 86400000);
    if (days > 0) return `vor ${days}d`;
    const hours = Math.floor(diffMs / 3600000);
    if (hours > 0) return `vor ${hours}h`;
    const mins = Math.floor(diffMs / 60000);
    return mins > 0 ? `vor ${mins}m` : 'gerade eben';
  }

  function fmtNum(n) {
    if (n === null || n === undefined) return '–';
    return n.toLocaleString('de-DE');
  }

  function fmtBytes(n) {
    if (n === null || n === undefined) return '–';
    if (n < 1024) return `${n} B`;
    if (n < 1024 ** 2) return `${(n / 1024).toFixed(1)} KB`;
    if (n < 1024 ** 3) return `${(n / 1024 ** 2).toFixed(1)} MB`;
    return `${(n / 1024 ** 3).toFixed(2)} GB`;
  }

  async function init() {
    const me = await fetch('/api/me').then(r => r.json());
    if (!me.loggedIn) return renderLogin();
    renderLoading();
    try {
      const stats = await fetch('/api/stats').then(r => {
        if (!r.ok) throw new Error('no-data');
        return r.json();
      });
      renderDashboard(stats);
    } catch {
      renderLoading(true);
    }
  }

  function renderLogin() {
    const params = new URLSearchParams(location.search);
    const denied = params.get('error') === 'auth_failed';
    app.innerHTML = `
      <div class="login-screen">
        <h1>admin.eselbande.com</h1>
        <p>Privates Projekt-Dashboard. Nur für einen bestimmten Discord-Account freigeschaltet.</p>
        ${denied ? '<p class="denied">Anmeldung fehlgeschlagen.</p>' : ''}
        <a class="discord-btn" href="/auth/login">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.076.076 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>
          Mit Discord anmelden
        </a>
      </div>`;
  }

  function renderLoading(failed) {
    app.innerHTML = `<div class="empty">${failed ? 'Noch keine Daten gesammelt – der Collector läuft alle paar Minuten auf dem Server.' : 'Lädt …'}</div>`;
  }

  function statusPill(up) {
    if (up === null || up === undefined) return `<span class="dot unknown"></span>unbekannt`;
    return up ? `<span class="dot up"></span>online` : `<span class="dot down"></span>down`;
  }

  function table(headers, rows, emptyText) {
    if (!rows || !rows.length) return `<div class="empty">${emptyText || 'Keine Daten.'}</div>`;
    const head = headers.map(h => `<th${h.num ? ' class="num"' : ''}>${h.label}</th>`).join('');
    return `<table><thead><tr>${head}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
  }

  // ── Container-Übersicht ───────────────────────────────────────────────────
  function containersTable(containers) {
    if (!containers || !containers.length) return '<div class="empty">Keine Container-Daten.</div>';
    const rows = containers.map(c => {
      const badge = c.health
        ? `<span class="badge ${c.health}">${esc(c.health)}</span>`
        : `<span class="badge">${c.running ? 'läuft' : esc(c.status)}</span>`;
      const ports = (c.ports || []).length ? c.ports.join(', ') : '–';
      const res = c.running && c.cpu_pct !== undefined
        ? `${c.cpu_pct ?? '–'}% · ${c.mem_usage || '–'}`
        : '–';
      return `
        <tr>
          <td>${statusPill(c.running)}<span class="mono">${esc(c.name)}</span></td>
          <td class="muted mono">${esc(c.id || '')}</td>
          <td class="muted truncate" title="${esc(c.image)}">${esc(c.image)}</td>
          <td>${badge}</td>
          <td class="muted">${ports}</td>
          <td class="muted">${res}</td>
          <td class="muted">${c.started_at ? fmtRelative(c.started_at) : '–'}</td>
          <td class="muted">${c.restart_count > 0 ? c.restart_count + '×' : '–'}</td>
        </tr>`;
    });
    return table([
      { label: 'Container' }, { label: 'ID' }, { label: 'Image' }, { label: 'Status' },
      { label: 'Ports' }, { label: 'CPU · RAM' }, { label: 'Läuft seit' }, { label: 'Neustarts' },
    ], rows);
  }

  function statuspageTable(services) {
    if (!services || !services.length) return '<div class="empty">Keine Statuspage-Daten.</div>';
    const rows = services.map(s => `
      <tr>
        <td>${statusPill(s.up)}<span class="mono">${esc(s.service)}</span></td>
        <td class="muted num">${s.uptime_pct !== null ? s.uptime_pct + '%' : '–'}</td>
        <td class="muted num">${s.latency_ms !== null ? s.latency_ms + ' ms' : '–'}</td>
        <td class="muted num">${fmtNum(s.sample_count)}</td>
        <td class="muted">${fmtDate(s.last_check)}</td>
      </tr>`);
    return table([
      { label: 'Dienst' }, { label: 'Uptime', num: true }, { label: 'Latenz', num: true },
      { label: 'Messungen', num: true }, { label: 'Letzte Messung' },
    ], rows);
  }

  // ── Projekt-Detailkarten ──────────────────────────────────────────────────
  function projectPanel(key, title, summaryHtml, bodyHtml) {
    return `
      <details class="project" data-key="${key}">
        <summary>
          <div>
            <div class="proj-title">${title}</div>
            <div class="proj-summary">${summaryHtml}</div>
          </div>
          <svg class="chevron" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 6l6 6-6 6"/></svg>
        </summary>
        <div class="proj-body">${bodyHtml}</div>
      </details>`;
  }

  function filehosterPanel(d) {
    if (!d) return '';
    const summary = `${fmtNum(d.files)} Dateien · ${d.storage_mb} MB · ${fmtNum(d.total_downloads)} Downloads · ${fmtNum(d.api_tokens)} Tokens`;
    const files = (d.recent_files || []).map(f => `
      <tr>
        <td class="truncate" title="${esc(f.orig_name)}">${esc(f.orig_name)}</td>
        <td class="muted num">${fmtBytes(f.size)}</td>
        <td class="muted num">${fmtNum(f.downloads)}</td>
        <td><span class="badge ${f.is_public ? 'pub' : 'priv'}">${f.is_public ? 'öffentlich' : 'privat'}</span></td>
        <td class="muted">${fmtDate(f.created_at)}</td>
      </tr>`);
    const users = (d.user_list || []).map(u => `
      <tr>
        <td>${esc(u.username)}</td>
        <td class="muted num">${fmtNum(u.files)}</td>
        <td class="muted num">${fmtBytes(u.storage_bytes)}</td>
        <td class="muted num">${fmtNum(u.downloads)}</td>
      </tr>`);
    return projectPanel('filehoster', 'EselShot / Filehoster', summary, `
      <div class="two-col">
        <div>
          <h3>Neueste Dateien</h3>
          ${table([{label:'Name'},{label:'Größe',num:true},{label:'Downloads',num:true},{label:'Sichtbarkeit'},{label:'Hochgeladen'}], files)}
        </div>
        <div>
          <h3>Nutzer</h3>
          ${table([{label:'Nutzer'},{label:'Dateien',num:true},{label:'Speicher',num:true},{label:'Downloads',num:true}], users)}
        </div>
      </div>`);
  }

  function zitatboardPanel(d) {
    if (!d) return '';
    const summary = `${fmtNum(d.quotes)} Zitate · ${fmtNum(d.votes)} Votes · ${fmtNum(d.users)} Nutzer`;
    const top = (d.top_quotes || []).map(q => `
      <tr>
        <td class="truncate" title="${esc(q.text)}">„${esc(q.text)}“${q.attributed_to ? ' — ' + esc(q.attributed_to) : ''}</td>
        <td class="muted">${esc(q.submitted_by || '–')}</td>
        <td class="muted num">${q.score > 0 ? '+' : ''}${fmtNum(q.score)}</td>
      </tr>`);
    const recent = (d.recent_quotes || []).map(q => `
      <tr>
        <td class="truncate" title="${esc(q.text)}">„${esc(q.text)}“${q.attributed_to ? ' — ' + esc(q.attributed_to) : ''}</td>
        <td class="muted">${esc(q.submitted_by || '–')}</td>
        <td class="muted">${fmtDate(q.created_at)}</td>
      </tr>`);
    return projectPanel('zitatboard', 'Zitat-Board', summary, `
      <div class="two-col">
        <div>
          <h3>Beliebteste Zitate</h3>
          ${table([{label:'Zitat'},{label:'Von'},{label:'Punkte',num:true}], top)}
        </div>
        <div>
          <h3>Neueste Zitate</h3>
          ${table([{label:'Zitat'},{label:'Von'},{label:'Datum'}], recent)}
        </div>
      </div>`);
  }

  function linkshortenerPanel(d) {
    if (!d) return '';
    const summary = `${fmtNum(d.links)} Links · ${fmtNum(d.total_clicks)} Klicks · ${fmtNum(d.users)} Nutzer`;
    const top = (d.top_links || []).map(l => `
      <tr>
        <td class="mono">/${esc(l.slug)}</td>
        <td class="muted truncate" title="${esc(l.url)}">${esc(l.url)}</td>
        <td class="muted num">${fmtNum(l.clicks)}</td>
        <td class="muted">${esc(l.created_by || '–')}</td>
      </tr>`);
    return projectPanel('linkshortener', 'Linkshortener', summary, `
      <h3>Meistgeklickte Links</h3>
      ${table([{label:'Slug'},{label:'Ziel'},{label:'Klicks',num:true},{label:'Erstellt von'}], top)}`);
  }

  function eseltokensPanel(d) {
    if (!d) return '';
    const summary = `${fmtNum(d.users)} Nutzer · ${fmtNum(d.total_balance)} Guthaben · ${fmtNum(d.giveaways)} Giveaways`;
    const roles = (d.role_breakdown || []).map(r => `
      <tr><td>${esc(r.role)}</td><td class="muted num">${fmtNum(r.count)}</td></tr>`);
    const top = (d.top_balances || []).map(u => `
      <tr>
        <td>${esc(u.username)}</td>
        <td class="muted">${esc(u.role)}</td>
        <td class="muted num">${fmtNum(u.balance)}</td>
        <td class="muted num">${fmtNum(u.xp)}</td>
      </tr>`);
    const tx = (d.transaction_types || []).map(t => `
      <tr>
        <td class="mono">${esc(t.type)}</td>
        <td class="muted num">${fmtNum(t.count)}</td>
        <td class="muted num">${fmtNum(t.total_amount)}</td>
      </tr>`);
    return projectPanel('eseltokens', 'EselTokens', summary, `
      <div class="two-col">
        <div>
          <h3>Top-Guthaben</h3>
          ${table([{label:'Nutzer'},{label:'Rolle'},{label:'Guthaben',num:true},{label:'XP',num:true}], top)}
          <h3>Rollen</h3>
          ${table([{label:'Rolle'},{label:'Anzahl',num:true}], roles)}
        </div>
        <div>
          <h3>Transaktionsarten</h3>
          ${table([{label:'Typ'},{label:'Anzahl',num:true},{label:'Summe',num:true}], tx)}
        </div>
      </div>`);
  }

  function fahrstuhlPanel(d) {
    if (!d) return '';
    const summary = `${fmtNum(d.command_executions)} Befehle · ${fmtNum(d.premium_guilds)} Premium-Server · ${fmtNum(d.premium_users)} Premium-Nutzer`;
    const cmds = (d.top_commands || []).map(c => `
      <tr>
        <td class="mono">/${esc(c.command)}</td>
        <td class="muted num">${fmtNum(c.count)}</td>
        <td class="muted num">${c.failures > 0 ? fmtNum(c.failures) : '–'}</td>
      </tr>`);
    const errors = (d.recent_errors || []).map(e => `
      <tr>
        <td class="mono">/${esc(e.command)}</td>
        <td class="muted truncate" title="${esc(e.error_message)}">${esc(e.error_message || '–')}</td>
        <td class="muted">${fmtDate(e.timestamp)}</td>
      </tr>`);
    return projectPanel('fahrstuhl', 'Fahrstuhl', summary, `
      <div class="two-col">
        <div>
          <h3>Meistgenutzte Befehle</h3>
          ${table([{label:'Befehl'},{label:'Anzahl',num:true},{label:'Fehler',num:true}], cmds)}
        </div>
        <div>
          <h3>Letzte Fehler</h3>
          ${table([{label:'Befehl'},{label:'Meldung'},{label:'Datum'}], errors, 'Keine Fehler aufgezeichnet.')}
        </div>
      </div>`);
  }

  function musikbotPanel(d) {
    if (!d) return '';
    const summary = `${fmtNum(d.songs_played)} Songs gespielt · ${fmtNum(d.guilds)} Server`;
    const top = (d.top_songs || []).map(s => `
      <tr>
        <td class="truncate" title="${esc(s.title)}">${esc(s.title)}</td>
        <td class="muted">${esc(s.author || '–')}</td>
        <td class="muted num">${fmtNum(s.play_count)}</td>
      </tr>`);
    const recent = (d.recent_plays || []).map(p => `
      <tr>
        <td class="truncate" title="${esc(p.title)}">${esc(p.title)}</td>
        <td class="muted">${esc(p.author || '–')}</td>
        <td class="muted">${fmtDate(p.played_at)}</td>
      </tr>`);
    return projectPanel('musikbot', 'Musikbot', summary, `
      <div class="two-col">
        <div>
          <h3>Meistgespielte Songs</h3>
          ${table([{label:'Titel'},{label:'Künstler'},{label:'Wiedergaben',num:true}], top)}
        </div>
        <div>
          <h3>Zuletzt gespielt</h3>
          ${table([{label:'Titel'},{label:'Künstler'},{label:'Datum'}], recent)}
        </div>
      </div>`);
  }

  function projectPanels(projects) {
    const p = projects || {};
    return [
      filehosterPanel(p.filehoster),
      zitatboardPanel(p.zitatboard),
      linkshortenerPanel(p.linkshortener),
      eseltokensPanel(p.eseltokens),
      fahrstuhlPanel(p.fahrstuhl),
      musikbotPanel(p.musikbot),
    ].join('');
  }

  function summaryCards(stats) {
    const running = (stats.containers || []).filter(c => c.running).length;
    const total = (stats.containers || []).length;
    const disk = stats.disk;
    const diskCls = disk ? (disk.used_pct > 90 ? 'danger' : disk.used_pct > 75 ? 'warn' : '') : '';
    return `
      <div class="card">
        <div class="label">Container</div>
        <div class="value">${running} / ${total}</div>
        <div class="sub">laufen</div>
      </div>
      ${disk ? `
      <div class="card">
        <div class="label">Festplatte</div>
        <div class="value">${disk.used_pct}%</div>
        <div class="sub">${disk.used_gb} GB von ${disk.total_gb} GB · ${disk.free_gb} GB frei</div>
        <div class="diskbar"><div class="diskbar-fill ${diskCls}" style="width:${disk.used_pct}%"></div></div>
      </div>` : ''}`;
  }

  function renderDashboard(stats) {
    const staleWarning = (() => {
      const genAge = Date.now() - new Date(stats.generated_at).getTime();
      if (genAge > 30 * 60 * 1000) {
        return `<div class="error-box">Daten sind ${fmtRelative(stats.generated_at)} alt – prüfen, ob der Collector-Cronjob noch läuft.</div>`;
      }
      return '';
    })();

    app.innerHTML = `
      <header>
        <div class="brand"><span>eselbande</span> · Projekt-Dashboard</div>
        <div style="display:flex;align-items:center;gap:14px">
          <span class="updated">Stand: ${fmtDate(stats.generated_at)} (${fmtRelative(stats.generated_at)})</span>
          <a class="logout" href="/auth/logout">Abmelden</a>
        </div>
      </header>

      ${staleWarning}

      <div class="grid">${summaryCards(stats)}</div>

      <section>
        <h2>Projekte <span class="count-pill">zum Aufklappen</span></h2>
        ${projectPanels(stats.projects)}
      </section>

      <section>
        <h2>Dienste <span class="count-pill">${(stats.containers||[]).length}</span></h2>
        ${containersTable(stats.containers)}
      </section>

      <section>
        <h2>Erreichbarkeit <span class="count-pill">statuspage.eselbande.com</span></h2>
        ${statuspageTable(stats.statuspage)}
      </section>
    `;
  }

  init();
</script>
</body>
</html>
