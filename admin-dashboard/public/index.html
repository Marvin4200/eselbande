<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard · eselbande</title>
<style>
:root {
    --bg: #0d1117;
    --bg-alt: #010409;
    --karte: #161b22;
    --karte-hover: #1c2129;
    --rand: #26303b;
    --rand-hell: #364250;
    --text: #e6edf3;
    --gedaempft: #8b949e;
    --leise: #6e7681;
    --akzent: #f0b429;
    --gruen: #3fb950;
    --gelb: #d29922;
    --rot: #f85149;
    --blau: #58a6ff;
    --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
}
a { color: var(--blau); text-decoration: none; }
a:hover { text-decoration: underline; }
.wrap { max-width: 1400px; margin: 0 auto; padding: 0 20px 64px; }

/* ── Kopfleiste ─────────────────────────────────────────────── */
header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(13,17,23,.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rand);
}
.kopf {
    max-width: 1400px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
}
.marke { font-weight: 650; font-size: 1.05rem; letter-spacing: -.01em; }
.marke span { color: var(--akzent); }
.kopf-rechts { margin-left: auto; display: flex; align-items: center; gap: 14px; font-size: .82rem; color: var(--gedaempft); }
.puls { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gruen); margin-right: 6px; }
.knopf {
    background: var(--karte); border: 1px solid var(--rand); color: var(--text);
    padding: 6px 12px; border-radius: 7px; font-size: .82rem; cursor: pointer;
    font-family: inherit;
}
.knopf:hover { background: var(--karte-hover); border-color: var(--rand-hell); }

/* ── Kennzahlen ─────────────────────────────────────────────── */
.kennzahlen {
    display: grid; gap: 14px; margin: 22px 0;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
}
.kz {
    background: var(--karte); border: 1px solid var(--rand);
    border-radius: var(--radius); padding: 16px 18px;
    position: relative; overflow: hidden;
}
.kz::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--rand-hell);
}
.kz.gut::before { background: var(--gruen); }
.kz.warn::before { background: var(--gelb); }
.kz.schlecht::before { background: var(--rot); }
.kz-titel { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--leise); margin-bottom: 8px; }
.kz-wert { font-size: 1.85rem; font-weight: 640; line-height: 1.1; letter-spacing: -.02em; }
.kz-wert small { font-size: .95rem; font-weight: 400; color: var(--gedaempft); }
.kz-zusatz { font-size: .78rem; color: var(--gedaempft); margin-top: 5px; }
.balken { height: 4px; background: var(--bg-alt); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.balken i { display: block; height: 100%; background: var(--gruen); border-radius: 3px; }
.balken i.warn { background: var(--gelb); }
.balken i.schlecht { background: var(--rot); }

/* ── Reiter ─────────────────────────────────────────────────── */
.reiter { display: flex; gap: 4px; border-bottom: 1px solid var(--rand); margin-bottom: 22px; overflow-x: auto; }
.reiter button {
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--gedaempft); padding: 10px 15px; font-size: .9rem; cursor: pointer;
    font-family: inherit; white-space: nowrap; margin-bottom: -1px;
}
.reiter button:hover { color: var(--text); }
.reiter button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--akzent); font-weight: 550; }
.reiter .zahl {
    background: var(--rand); color: var(--gedaempft); border-radius: 20px;
    padding: 1px 7px; font-size: .72rem; margin-left: 6px;
}
.blatt[hidden] { display: none; }

/* ── Karten & Raster ────────────────────────────────────────── */
.karte {
    background: var(--karte); border: 1px solid var(--rand);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 18px;
}
.karte-kopf {
    padding: 13px 18px; border-bottom: 1px solid var(--rand);
    display: flex; align-items: center; gap: 10px;
}
.karte-kopf h2 { font-size: .92rem; font-weight: 600; }
.karte-kopf .neben { margin-left: auto; font-size: .78rem; color: var(--gedaempft); }
.karte-koerper { padding: 16px 18px; }
.raster { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

/* ── Container-Kacheln ──────────────────────────────────────── */
.container-raster { display: grid; gap: 9px; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); }
.cont {
    background: var(--bg-alt); border: 1px solid var(--rand); border-radius: 8px;
    padding: 11px 13px; display: flex; align-items: center; gap: 10px;
}
.punkt { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--leise); }
.punkt.gruen { background: var(--gruen); box-shadow: 0 0 0 3px rgba(63,185,80,.14); }
.punkt.gelb { background: var(--gelb); box-shadow: 0 0 0 3px rgba(210,153,34,.14); }
.punkt.rot { background: var(--rot); box-shadow: 0 0 0 3px rgba(248,81,73,.14); }
.cont-name { font-size: .84rem; font-weight: 520; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cont-meta { font-size: .72rem; color: var(--leise); margin-top: 1px; }
.cont-rechts { margin-left: auto; text-align: right; font-size: .72rem; color: var(--gedaempft); white-space: nowrap; }

/* ── Tabellen ───────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; font-size: .84rem; }
th {
    text-align: left; font-weight: 550; color: var(--leise); padding: 8px 10px;
    border-bottom: 1px solid var(--rand); font-size: .74rem;
    text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
}
td { padding: 9px 10px; border-bottom: 1px solid rgba(38,48,59,.55); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,.018); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabelle-scroll { overflow-x: auto; }

/* ── Protokoll ──────────────────────────────────────────────── */
.filter { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filter button {
    background: var(--bg-alt); border: 1px solid var(--rand); color: var(--gedaempft);
    padding: 5px 11px; border-radius: 20px; font-size: .78rem; cursor: pointer; font-family: inherit;
}
.filter button:hover { border-color: var(--rand-hell); color: var(--text); }
.filter button[aria-pressed="true"] { background: var(--akzent); border-color: var(--akzent); color: #1a1200; font-weight: 550; }
.suche {
    background: var(--bg-alt); border: 1px solid var(--rand); color: var(--text);
    padding: 6px 11px; border-radius: 7px; font-size: .82rem; font-family: inherit;
    min-width: 190px; margin-left: auto;
}
.suche:focus { outline: none; border-color: var(--akzent); }
.eintrag {
    display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(38,48,59,.55);
}
.eintrag:last-child { border-bottom: none; }
.e-links { flex-shrink: 0; width: 108px; }
.e-typ {
    display: inline-block; font-size: .66rem; font-weight: 600; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 4px; background: var(--rand); color: var(--gedaempft);
}
.e-typ.ERRORS { background: rgba(248,81,73,.15); color: #ff8983; }
.e-typ.WARNINGS { background: rgba(210,153,34,.15); color: #e3b341; }
.e-typ.SYSTEM { background: rgba(88,166,255,.13); color: var(--blau); }
.e-typ.WATCHDOG, .e-typ.BOT-STATUS { background: rgba(163,113,247,.15); color: #bc8cff; }
.e-typ.BACKUP, .e-typ.SPEICHER { background: rgba(63,185,80,.13); color: #56d364; }
.e-typ.SICHERHEIT { background: rgba(248,81,73,.13); color: #ff8983; }
.e-zeit { font-size: .7rem; color: var(--leise); margin-top: 4px; }
.e-rechts { min-width: 0; flex: 1; }
.e-titel { font-size: .87rem; font-weight: 550; margin-bottom: 2px; }
.e-text {
    font-size: .82rem; color: var(--gedaempft); white-space: pre-wrap;
    word-break: break-word; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .77rem; line-height: 1.5;
}
.e-quelle { font-size: .7rem; color: var(--leise); margin-top: 4px; }
.mehr {
    background: none; border: none; color: var(--blau); font-size: .76rem;
    cursor: pointer; padding: 3px 0; font-family: inherit;
}

/* ── Sonstiges ──────────────────────────────────────────────── */
.leer { color: var(--leise); font-size: .85rem; padding: 22px; text-align: center; }
.pille { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 550; }
.pille.auf { background: rgba(63,185,80,.14); color: #56d364; }
.pille.ab { background: rgba(248,81,73,.14); color: #ff8983; }
.anmeldung { max-width: 380px; margin: 15vh auto; text-align: center; padding: 36px 30px;
    background: var(--karte); border: 1px solid var(--rand); border-radius: 14px; }
.anmeldung h1 { font-size: 1.25rem; margin-bottom: 8px; }
.anmeldung p { color: var(--gedaempft); font-size: .88rem; margin-bottom: 22px; }
.anmeldung a {
    display: inline-block; background: #5865f2; color: #fff; padding: 10px 22px;
    border-radius: 8px; font-weight: 550; font-size: .9rem;
}
.anmeldung a:hover { background: #4752c4; text-decoration: none; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .78rem; }
@media (max-width: 640px) {
    .e-links { width: 84px; }
    .kz-wert { font-size: 1.5rem; }
    .suche { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
"use strict";

// ── Hilfsmittel ──────────────────────────────────────────────
function esc(s) {
    return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
// Erst maskieren, dann Auszeichnungen umsetzen - nie umgekehrt, sonst liesse
// sich ueber Log-Inhalte fremdes Markup einschleusen.
function escMd(s) {
    return esc(s)
        .replace(/```([\s\S]*?)```/g, function (_, i) { return "<code>" + i + "</code>"; })
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function zahl(n) {
    if (n == null || isNaN(n)) return "–";
    return Number(n).toLocaleString("de-DE");
}
function relativ(iso) {
    if (!iso) return "–";
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (isNaN(s)) return "–";
    if (s < 60) return "gerade eben";
    if (s < 3600) return Math.floor(s / 60) + " Min.";
    if (s < 86400) return Math.floor(s / 3600) + " Std.";
    return Math.floor(s / 86400) + " Tage";
}
function uhrzeit(iso) {
    if (!iso) return "–";
    var d = new Date(iso);
    if (isNaN(d)) return "–";
    var heute = new Date().toDateString() === d.toDateString();
    return heute
        ? d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
        : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + " " +
          d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

var zustand = { stats: null, logs: [], typen: [], zusammenfassung: null, filter: "", suche: "", blatt: "uebersicht" };

// ── Einstieg ─────────────────────────────────────────────────
async function start() {
    var ich;
    try { ich = await fetch("/api/me").then(function (r) { return r.json(); }); }
    catch (e) { ich = {}; }

    if (!ich || !ich.loggedIn) { anmeldungZeigen(); return; }

    try {
        zustand.stats = await fetch("/api/stats").then(function (r) { return r.ok ? r.json() : null; });
    } catch (e) { zustand.stats = null; }

    geruestZeichnen(ich);
    await protokollLaden(true);
    blattZeichnen();

    // Protokoll haeufiger nachladen als die Statistik: Meldungen sind das,
    // weswegen man hier draufschaut. Die Container-Werte sammelt der Server
    // ohnehin nur alle paar Minuten ein.
    setInterval(function () { protokollLaden(false); }, 15000);
    setInterval(statistikLaden, 60000);
}

async function statistikLaden() {
    try {
        var neu = await fetch("/api/stats").then(function (r) { return r.ok ? r.json() : null; });
        if (neu) { zustand.stats = neu; kennzahlenZeichnen(); if (zustand.blatt !== "protokoll") blattZeichnen(); }
    } catch (e) { /* naechster Versuch in einer Minute */ }
}

function anmeldungZeigen() {
    document.getElementById("app").innerHTML =
        '<div class="anmeldung">' +
        '<h1>Dashboard</h1>' +
        '<p>Dieser Bereich ist privat. Bitte mit Discord anmelden.</p>' +
        '<a href="/auth/login">Mit Discord anmelden</a>' +
        '</div>';
}

// ── Geruest ──────────────────────────────────────────────────
function geruestZeichnen(ich) {
    var name = esc((ich && ich.user && (ich.user.global_name || ich.user.username)) || "");
    document.getElementById("app").innerHTML =
        '<header><div class="kopf">' +
            '<div class="marke"><span>eselbande</span> Dashboard</div>' +
            '<div class="kopf-rechts">' +
                '<span><span class="puls"></span><span id="aktualisiert">läuft</span></span>' +
                (name ? "<span>" + name + "</span>" : "") +
                '<a class="knopf" href="/auth/logout">Abmelden</a>' +
            '</div>' +
        '</div></header>' +
        '<div class="wrap">' +
            '<div class="kennzahlen" id="kennzahlen"></div>' +
            '<div class="reiter" id="reiter"></div>' +
            '<div id="blatt"></div>' +
        '</div>';

    kennzahlenZeichnen();
    reiterZeichnen();
}

function reiterZeichnen() {
    var s = zustand.stats || {};
    var reiter = [
        { id: "uebersicht", text: "Übersicht" },
        { id: "protokoll", text: "Protokoll" },
        { id: "dienste", text: "Dienste", zahl: Object.keys(s.projects || {}).length }
    ];
    document.getElementById("reiter").innerHTML = reiter.map(function (r) {
        return '<button data-blatt="' + r.id + '" aria-selected="' + (zustand.blatt === r.id) + '">' +
            r.text + (r.zahl ? '<span class="zahl">' + r.zahl + "</span>" : "") + "</button>";
    }).join("");

    document.getElementById("reiter").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-blatt]");
        if (!b) return;
        zustand.blatt = b.dataset.blatt;
        Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) {
            x.setAttribute("aria-selected", String(x.dataset.blatt === zustand.blatt));
        });
        blattZeichnen();
    });
}

// ── Kennzahlen ───────────────────────────────────────────────
function kennzahlenZeichnen() {
    var s = zustand.stats;
    var ziel = document.getElementById("kennzahlen");
    if (!ziel) return;

    var karten = [];

    if (s && s.containers) {
        var laufen = s.containers.filter(function (c) { return c.running; }).length;
        var gesamt = s.containers.length;
        var krank = s.containers.filter(function (c) { return c.running && c.health === "unhealthy"; }).length;
        var stufe = krank ? "warn" : (laufen === gesamt ? "gut" : "schlecht");
        karten.push({
            stufe: stufe, titel: "Container",
            wert: laufen + ' <small>/ ' + gesamt + "</small>",
            zusatz: krank ? krank + " ungesund" : (laufen === gesamt ? "alle laufen" : (gesamt - laufen) + " gestoppt")
        });
    }

    if (s && s.disk) {
        var p = Number(s.disk.used_pct) || 0;
        var st = p >= 90 ? "schlecht" : p >= 80 ? "warn" : "gut";
        karten.push({
            stufe: st, titel: "Speicher",
            wert: p.toFixed(1) + " <small>%</small>",
            zusatz: s.disk.free_gb + " GB frei von " + s.disk.total_gb + " GB",
            balken: { pct: p, klasse: st === "gut" ? "" : st }
        });
    }

    // Meldungen der letzten 24 Stunden. Bewusst aus der serverseitigen
    // Zaehlung: die geladene Liste ist auf 200 Eintraege begrenzt und wuerde
    // hier sonst einfach bei 200 stehenbleiben.
    var zf = zustand.zusammenfassung;
    if (zf) {
        var nachTyp = {};
        (zf.byType || []).forEach(function (t) { nachTyp[t.type] = t.count; });
        var fehler = nachTyp.ERRORS || 0;
        karten.push({
            stufe: fehler > 50 ? "schlecht" : fehler > 0 ? "warn" : "gut",
            titel: "Meldungen (24 Std.)",
            wert: zahl(zf.total),
            zusatz: fehler ? zahl(fehler) + " davon Fehler" : "keine Fehler"
        });
    }

    if (s && s.statuspage && s.statuspage.length) {
        var auf = s.statuspage.filter(function (x) { return x.up; }).length;
        karten.push({
            stufe: auf === s.statuspage.length ? "gut" : "warn",
            titel: "Dienste erreichbar",
            wert: auf + ' <small>/ ' + s.statuspage.length + "</small>",
            zusatz: "laut Statuspage"
        });
    }

    ziel.innerHTML = karten.map(function (k) {
        return '<div class="kz ' + k.stufe + '">' +
            '<div class="kz-titel">' + esc(k.titel) + "</div>" +
            '<div class="kz-wert">' + k.wert + "</div>" +
            '<div class="kz-zusatz">' + esc(k.zusatz) + "</div>" +
            (k.balken ? '<div class="balken"><i class="' + k.balken.klasse + '" style="width:' +
                Math.min(100, k.balken.pct) + '%"></i></div>' : "") +
            "</div>";
    }).join("");
}

// ── Blattwechsel ─────────────────────────────────────────────
function blattZeichnen() {
    var ziel = document.getElementById("blatt");
    if (!ziel) return;
    if (zustand.blatt === "protokoll") { ziel.innerHTML = protokollBlatt(); protokollVerdrahten(); protokollListe(); }
    else if (zustand.blatt === "dienste") ziel.innerHTML = diensteBlatt();
    else ziel.innerHTML = uebersichtBlatt();
}

// ── Übersicht ────────────────────────────────────────────────
function uebersichtBlatt() {
    var s = zustand.stats;
    if (!s) return '<div class="karte"><div class="leer">Noch keine Daten gesammelt. Der Sammler läuft alle paar Minuten auf dem Server — das Protokoll funktioniert unabhängig davon.</div></div>';

    var html = "";

    // Container
    var cs = (s.containers || []).slice().sort(function (a, b) {
        if (a.running !== b.running) return a.running ? 1 : -1;   // Probleme nach oben
        var ah = a.health === "unhealthy" ? 0 : 1, bh = b.health === "unhealthy" ? 0 : 1;
        if (ah !== bh) return ah - bh;
        return a.name.localeCompare(b.name);
    });
    html += '<div class="karte"><div class="karte-kopf"><h2>Container</h2>' +
        '<span class="neben">' + cs.filter(function (c) { return c.running; }).length + " von " + cs.length + " laufen</span></div>" +
        '<div class="karte-koerper"><div class="container-raster">' +
        cs.map(function (c) {
            var farbe = !c.running ? "rot" : c.health === "unhealthy" ? "gelb" : "gruen";
            var kurz = c.name.replace(/-phase1$/, "");
            var mem = c.mem_pct ? Math.round(Number(c.mem_pct)) + " %" : "";
            return '<div class="cont">' +
                '<span class="punkt ' + farbe + '"></span>' +
                '<div style="min-width:0">' +
                    '<div class="cont-name">' + esc(kurz) + "</div>" +
                    '<div class="cont-meta">' + esc(c.running ? (c.health || "läuft") : c.status) +
                    (c.restart_count ? " · " + c.restart_count + "× neu" : "") + "</div>" +
                "</div>" +
                '<div class="cont-rechts">' + (c.running ? "CPU " + (c.cpu_pct || "0") + " %<br>RAM " + mem : "") + "</div>" +
            "</div>";
        }).join("") + "</div></div></div>";

    // Statuspage
    if (s.statuspage && s.statuspage.length) {
        var sp = s.statuspage.slice().sort(function (a, b) { return (a.up === b.up) ? a.service.localeCompare(b.service) : (a.up ? 1 : -1); });
        html += '<div class="karte"><div class="karte-kopf"><h2>Erreichbarkeit</h2>' +
            '<span class="neben">laut Statuspage</span></div><div class="tabelle-scroll"><table>' +
            "<thead><tr><th>Dienst</th><th>Status</th><th class='num'>Verfügbarkeit</th><th class='num'>Antwortzeit</th><th>Zuletzt geprüft</th></tr></thead><tbody>" +
            sp.map(function (x) {
                return "<tr><td>" + esc(x.service) + "</td>" +
                    '<td><span class="pille ' + (x.up ? "auf" : "ab") + '">' + (x.up ? "erreichbar" : "weg") + "</span></td>" +
                    '<td class="num">' + (x.uptime_pct != null ? Number(x.uptime_pct).toFixed(1) + " %" : "–") + "</td>" +
                    '<td class="num">' + (x.latency_ms != null ? x.latency_ms + " ms" : "–") + "</td>" +
                    "<td>" + relativ(x.last_check) + "</td></tr>";
            }).join("") + "</tbody></table></div></div>";
    }

    return html;
}

// ── Dienste ──────────────────────────────────────────────────
function tabelle(kopf, zeilen, leerText) {
    if (!zeilen || !zeilen.length) return '<div class="leer">' + esc(leerText || "Keine Daten.") + "</div>";
    return '<div class="tabelle-scroll"><table><thead><tr>' +
        kopf.map(function (h) { return "<th" + (h.num ? ' class="num"' : "") + ">" + esc(h.t || h) + "</th>"; }).join("") +
        "</tr></thead><tbody>" +
        zeilen.map(function (r) {
            return "<tr>" + r.map(function (z, i) {
                return "<td" + (kopf[i] && kopf[i].num ? ' class="num"' : "") + ">" + z + "</td>";
            }).join("") + "</tr>";
        }).join("") + "</tbody></table></div>";
}

function kennwert(label, wert) {
    return '<div><div class="kz-titel">' + esc(label) + '</div><div style="font-size:1.3rem;font-weight:600">' + esc(wert) + "</div></div>";
}

function diensteBlatt() {
    var p = (zustand.stats || {}).projects;
    if (!p) return '<div class="karte"><div class="leer">Noch keine Projektdaten gesammelt.</div></div>';

    var html = "";

    function block(titel, kennzahlen, inhalt) {
        return '<div class="karte"><div class="karte-kopf"><h2>' + esc(titel) + "</h2></div>" +
            '<div class="karte-koerper">' +
            '<div style="display:flex;gap:32px;flex-wrap:wrap;margin-bottom:16px">' + kennzahlen + "</div>" +
            (inhalt || "") + "</div></div>";
    }

    if (p.musikbot) {
        var m = p.musikbot;
        html += block("Musikbot",
            kennwert("Server", zahl(m.guilds)) + kennwert("Titel gespielt", zahl(m.songs_played)),
            tabelle([{ t: "Titel" }, { t: "Interpret" }, { t: "Wiedergaben", num: true }],
                (m.top_songs || []).slice(0, 8).map(function (s) {
                    return [esc(s.title), esc(s.author), zahl(s.play_count)];
                }), "Noch nichts gespielt."));
    }

    if (p.fahrstuhl) {
        var f = p.fahrstuhl;
        html += block("Fahrstuhl-Bot",
            kennwert("Befehle gesamt", zahl(f.command_executions)) +
            kennwert("Premium-Server", zahl(f.premium_guilds)) +
            kennwert("Premium-Nutzer", zahl(f.premium_users)),
            tabelle([{ t: "Befehl" }, { t: "Aufrufe", num: true }],
                (f.top_commands || []).slice(0, 8).map(function (c) {
                    return ["<code>/" + esc(c.command || c.name) + "</code>", zahl(c.count || c.executions)];
                }), "Keine Befehlsdaten."));
    }

    if (p.eseltokens) {
        var t = p.eseltokens;
        html += block("EselTokens",
            kennwert("Nutzer", zahl(t.users)) + kennwert("Guthaben gesamt", zahl(t.total_balance)) +
            kennwert("XP gesamt", zahl(t.total_xp)) + kennwert("Verlosungen", zahl(t.giveaways)),
            tabelle([{ t: "Nutzer" }, { t: "Guthaben", num: true }],
                (t.top_balances || []).slice(0, 8).map(function (b) {
                    return [esc(b.username || b.user_id), zahl(b.balance)];
                }), "Keine Guthaben."));
    }

    if (p.zitatboard) {
        var z = p.zitatboard;
        html += block("Zitat-Board",
            kennwert("Zitate", zahl(z.quotes)) + kennwert("Nutzer", zahl(z.users)) + kennwert("Stimmen", zahl(z.votes)),
            tabelle([{ t: "Zitat" }, { t: "Stimmen", num: true }],
                (z.top_quotes || []).slice(0, 6).map(function (q) {
                    return [esc(String(q.text || q.quote || "").slice(0, 110)), zahl(q.votes || q.score)];
                }), "Noch keine Zitate."));
    }

    if (p.filehoster) {
        var fh = p.filehoster;
        html += block("Filehoster",
            kennwert("Dateien", zahl(fh.files)) + kennwert("Nutzer", zahl(fh.users)) +
            kennwert("Belegt", (fh.storage_mb != null ? Number(fh.storage_mb).toFixed(1) + " MB" : "–")) +
            kennwert("Downloads", zahl(fh.total_downloads)),
            tabelle([{ t: "Datei" }, { t: "Größe", num: true }],
                (fh.recent_files || []).slice(0, 6).map(function (x) {
                    return [esc(x.filename || x.name), (x.size_mb != null ? Number(x.size_mb).toFixed(2) + " MB" : "–")];
                }), "Keine Dateien."));
    }

    if (p.linkshortener) {
        var l = p.linkshortener;
        html += block("Linkshortener",
            kennwert("Links", zahl(l.links)) + kennwert("Klicks", zahl(l.total_clicks)) + kennwert("Nutzer", zahl(l.users)),
            tabelle([{ t: "Kürzel" }, { t: "Ziel" }, { t: "Klicks", num: true }],
                (l.top_links || []).slice(0, 6).map(function (x) {
                    return ["<code>" + esc(x.slug || x.code) + "</code>",
                            esc(String(x.target || x.url || "").slice(0, 60)), zahl(x.clicks)];
                }), "Keine Links."));
    }

    return html || '<div class="karte"><div class="leer">Keine Projektdaten.</div></div>';
}

// ── Protokoll ────────────────────────────────────────────────
function protokollBlatt() {
    return '<div class="karte">' +
        '<div class="karte-kopf"><h2>Protokoll</h2><span class="neben" id="log-anzahl"></span></div>' +
        '<div class="karte-koerper">' +
            '<div class="filter" id="log-filter"></div>' +
            '<div id="log-liste"><div class="leer">Lädt …</div></div>' +
        "</div></div>";
}

function protokollVerdrahten() {
    var f = document.getElementById("log-filter");
    if (!f) return;

    var knoepfe = '<button data-typ="" aria-pressed="' + (zustand.filter === "") + '">Alle</button>' +
        zustand.typen.map(function (t) {
            return '<button data-typ="' + esc(t.type) + '" aria-pressed="' + (zustand.filter === t.type) + '">' +
                esc(t.type) + " <span class='zahl'>" + t.count + "</span></button>";
        }).join("");
    f.innerHTML = knoepfe + '<input class="suche" id="log-suche" type="search" placeholder="Durchsuchen …" value="' + esc(zustand.suche) + '">';

    f.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-typ]");
        if (!b) return;
        zustand.filter = b.dataset.typ;
        Array.prototype.forEach.call(f.querySelectorAll("button[data-typ]"), function (x) {
            x.setAttribute("aria-pressed", String(x.dataset.typ === zustand.filter));
        });
        protokollListe();
    });

    var suche = document.getElementById("log-suche");
    var timer;
    suche.addEventListener("input", function () {
        clearTimeout(timer);
        timer = setTimeout(function () { zustand.suche = suche.value.trim().toLowerCase(); protokollListe(); }, 200);
    });
}

async function protokollLaden(erst) {
    try {
        var typen = await fetch("/api/logs/types").then(function (r) { return r.ok ? r.json() : []; });
        zustand.typen = (Array.isArray(typen) ? typen : (typen.types || [])).filter(function (t) { return t && t.type; });
    } catch (e) { /* Filter bleiben wie sie sind */ }

    try {
        zustand.zusammenfassung = await fetch("/api/logs/summary?hours=24")
            .then(function (r) { return r.ok ? r.json() : null; });
    } catch (e) { /* Kennzahl bleibt beim letzten Stand */ }

    try {
        var antwort = await fetch("/api/logs?limit=200").then(function (r) { return r.ok ? r.json() : null; });
        var liste = Array.isArray(antwort) ? antwort : (antwort && antwort.logs) || [];
        zustand.logs = liste;
    } catch (e) { /* naechster Durchlauf */ }

    var a = document.getElementById("aktualisiert");
    if (a) a.textContent = "aktualisiert " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

    kennzahlenZeichnen();
    if (!erst && zustand.blatt === "protokoll") { protokollVerdrahten(); protokollListe(); }
}

function protokollListe() {
    var ziel = document.getElementById("log-liste");
    if (!ziel) return;

    var liste = zustand.logs.filter(function (l) {
        if (zustand.filter && l.type !== zustand.filter) return false;
        if (zustand.suche) {
            var heu = ((l.title || "") + " " + (l.description || "") + " " + (l.source || "")).toLowerCase();
            if (heu.indexOf(zustand.suche) === -1) return false;
        }
        return true;
    });

    var z = document.getElementById("log-anzahl");
    if (z) z.textContent = liste.length + " von " + zustand.logs.length + " Einträgen";

    if (!liste.length) { ziel.innerHTML = '<div class="leer">Keine passenden Einträge.</div>'; return; }

    ziel.innerHTML = liste.map(function (l) {
        var text = String(l.description || "");
        var lang = text.length > 300;
        var kurz = lang ? text.slice(0, 300) + " …" : text;
        return '<div class="eintrag">' +
            '<div class="e-links">' +
                '<span class="e-typ ' + esc(l.type) + '">' + esc(l.type) + "</span>" +
                '<div class="e-zeit">' + uhrzeit(l.created_at) + "</div>" +
            "</div>" +
            '<div class="e-rechts">' +
                (l.title ? '<div class="e-titel">' + escMd(l.title) + "</div>" : "") +
                '<div class="e-text" data-kurz="' + esc(kurz) + '" data-lang="' + esc(text) + '">' + escMd(kurz) + "</div>" +
                (lang ? '<button class="mehr" data-auf="0">mehr anzeigen</button>' : "") +
                '<div class="e-quelle">' + esc(l.source || "") + "</div>" +
            "</div>" +
        "</div>";
    }).join("");
}

// Ein einziger Zuhoerer statt einer je Eintrag - die Liste wird alle 15
// Sekunden neu gezeichnet, einzelne Zuhoerer wuerden sich sonst ansammeln.
document.addEventListener("click", function (e) {
    var b = e.target.closest(".mehr");
    if (!b) return;
    var text = b.parentElement.querySelector(".e-text");
    var auf = b.dataset.auf === "1";
    text.innerHTML = escMd(auf ? text.dataset.kurz : text.dataset.lang);
    b.dataset.auf = auf ? "0" : "1";
    b.textContent = auf ? "mehr anzeigen" : "weniger anzeigen";
});

start();
})();
</script>
</body>
</html>
