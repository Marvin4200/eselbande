<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Dashboard · eselbande</title>
<style>
:root {
    --bg: #0d1117;
    --bg-alt: #010409;
    --karte: #161b22;
    --karte-hover: #1c2129;
    --rand: #26303b;
    --rand-hell: #364250;
    --text: #e6edf3;
    --gedaempft: #8b949e;
    --leise: #6e7681;
    --akzent: #f0b429;
    --gruen: #3fb950;
    --gelb: #d29922;
    --rot: #f85149;
    --blau: #58a6ff;
    --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
}
a { color: var(--blau); text-decoration: none; }
a:hover { text-decoration: underline; }
.knopf {
    background: var(--karte); border: 1px solid var(--rand); color: var(--text);
    padding: 6px 12px; border-radius: 7px; font-size: .82rem; cursor: pointer;
    font-family: inherit;
}
.knopf:hover { background: var(--karte-hover); border-color: var(--rand-hell); }
.puls { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--gruen); margin-right: 6px; flex-shrink: 0; }

/* ── Gesamt-Geruest: feste Seitenleiste + scrollbarer Inhalt ──── */
.app-schale { display: flex; min-height: 100vh; }
.sidebar {
    width: 234px; flex-shrink: 0; background: var(--karte); border-right: 1px solid var(--rand);
    display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 30;
}
.sidebar-marke {
    padding: 20px 20px 16px; font-weight: 650; font-size: 1.05rem; letter-spacing: -.01em;
    display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--rand);
}
.sidebar-marke span { color: var(--akzent); }
.sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 10px; }
.sidebar-gruppe { font-size: .68rem; text-transform: uppercase; letter-spacing: .07em; color: var(--leise); padding: 14px 10px 6px; }
.sidebar-gruppe:first-child { padding-top: 4px; }
.sidebar-nav button {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    background: none; border: none; color: var(--gedaempft); padding: 9px 10px; border-radius: 7px;
    font-size: .87rem; cursor: pointer; font-family: inherit; margin-bottom: 2px;
}
.sidebar-nav button .ico { font-size: 1rem; width: 18px; text-align: center; flex-shrink: 0; }
.sidebar-nav button .zahl {
    margin-left: auto; background: var(--rand); color: var(--gedaempft); border-radius: 20px;
    padding: 1px 7px; font-size: .7rem;
}
.sidebar-nav button:hover { background: var(--karte-hover); color: var(--text); }
.sidebar-nav button[aria-current="true"] {
    background: rgba(240,180,41,.12); color: var(--text); font-weight: 550;
}
.sidebar-nav button[aria-current="true"] .zahl { background: rgba(240,180,41,.22); color: var(--akzent); }
.sidebar-fuss { border-top: 1px solid var(--rand); padding: 14px 16px; font-size: .8rem; color: var(--gedaempft); }
.sidebar-fuss .zeile { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.sidebar-fuss .rolle {
    font-size: .66rem; text-transform: uppercase; letter-spacing: .04em; color: var(--leise);
    background: var(--bg-alt); border: 1px solid var(--rand); border-radius: 5px; padding: 1px 6px;
}

.hauptbereich { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topleiste {
    position: sticky; top: 0; z-index: 20; background: rgba(13,17,23,.92); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--rand); padding: 14px 28px; display: flex; align-items: center; gap: 12px;
}
.topleiste h1 { font-size: 1.05rem; font-weight: 620; }
.topleiste .neben { margin-left: auto; font-size: .78rem; color: var(--gedaempft); }
.menu-knopf { display: none; background: none; border: 1px solid var(--rand); color: var(--text);
    border-radius: 7px; padding: 6px 10px; font-size: 1rem; cursor: pointer; }
.inhalt-bereich { padding: 22px 28px 64px; }

/* ── Startseite: Alarme ─────────────────────────────────────── */
.alarme { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
.alarm {
    display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 9px;
    font-size: .87rem; border: 1px solid transparent;
}
.alarm.schlecht { background: rgba(248,81,73,.1); border-color: rgba(248,81,73,.3); color: #ffb4af; }
.alarm.warn { background: rgba(210,153,34,.1); border-color: rgba(210,153,34,.3); color: #f0cd7a; }
.alles-gut {
    display: flex; align-items: center; gap: 10px; padding: 11px 15px; border-radius: 9px;
    font-size: .87rem; background: rgba(63,185,80,.08); border: 1px solid rgba(63,185,80,.25); color: #8fe0a3;
    margin-bottom: 20px;
}
.start-raster { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); margin-top: 4px; }
.schnellzugriff { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
.schnellzugriff button {
    background: var(--karte); border: 1px solid var(--rand); color: var(--text);
    padding: 10px 16px; border-radius: 9px; font-size: .85rem; cursor: pointer; font-family: inherit;
    display: flex; align-items: center; gap: 8px;
}
.schnellzugriff button:hover { border-color: var(--akzent); }

/* ── Kennzahlen ─────────────────────────────────────────────── */
.kennzahlen {
    display: grid; gap: 14px; margin-bottom: 20px;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
}
.kz {
    background: var(--karte); border: 1px solid var(--rand);
    border-radius: var(--radius); padding: 16px 18px;
    position: relative; overflow: hidden;
}
.kz::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--rand-hell);
}
.kz.gut::before { background: var(--gruen); }
.kz.warn::before { background: var(--gelb); }
.kz.schlecht::before { background: var(--rot); }
.kz-titel { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--leise); margin-bottom: 8px; }
.kz-wert { font-size: 1.85rem; font-weight: 640; line-height: 1.1; letter-spacing: -.02em; }
.kz-wert small { font-size: .95rem; font-weight: 400; color: var(--gedaempft); }
.kz-zusatz { font-size: .78rem; color: var(--gedaempft); margin-top: 5px; }
.balken { height: 4px; background: var(--bg-alt); border-radius: 3px; margin-top: 10px; overflow: hidden; }
.balken i { display: block; height: 100%; background: var(--gruen); border-radius: 3px; }
.balken i.warn { background: var(--gelb); }
.balken i.schlecht { background: var(--rot); }

.blatt[hidden] { display: none; }

/* ── Karten & Raster ────────────────────────────────────────── */
.karte {
    background: var(--karte); border: 1px solid var(--rand);
    border-radius: var(--radius); overflow: hidden; margin-bottom: 18px;
}
.karte-kopf {
    padding: 13px 18px; border-bottom: 1px solid var(--rand);
    display: flex; align-items: center; gap: 10px;
}
.karte-kopf h2 { font-size: .92rem; font-weight: 600; }
.karte-kopf .neben { margin-left: auto; font-size: .78rem; color: var(--gedaempft); }
.karte-koerper { padding: 16px 18px; }
.raster { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

/* ── Container-Kacheln ──────────────────────────────────────── */
.container-raster { display: grid; gap: 9px; grid-template-columns: repeat(auto-fill, minmax(228px, 1fr)); }
.cont {
    background: var(--bg-alt); border: 1px solid var(--rand); border-radius: 8px;
    padding: 11px 13px; display: flex; align-items: center; gap: 10px;
}
.punkt { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--leise); }
.punkt.gruen { background: var(--gruen); box-shadow: 0 0 0 3px rgba(63,185,80,.14); }
.punkt.gelb { background: var(--gelb); box-shadow: 0 0 0 3px rgba(210,153,34,.14); }
.punkt.rot { background: var(--rot); box-shadow: 0 0 0 3px rgba(248,81,73,.14); }
.cont-name { font-size: .84rem; font-weight: 520; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cont-meta { font-size: .72rem; color: var(--leise); margin-top: 1px; }
.cont-rechts { margin-left: auto; text-align: right; font-size: .72rem; color: var(--gedaempft); white-space: nowrap; }
.cont-aktionen { display: flex; gap: 4px; flex-shrink: 0; }
.cont-aktionen button {
    background: var(--bg-alt); border: 1px solid var(--rand); color: var(--gedaempft);
    border-radius: 5px; padding: 3px 7px; font-size: .78rem; cursor: pointer; font-family: inherit; line-height: 1.3;
}
.cont-aktionen button:hover { color: var(--text); border-color: var(--rand-hell); }
.cont-aktionen button:disabled { opacity: .4; cursor: default; }

/* ── Log-Ansicht ────────────────────────────────────────────── */
.log-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 100;
    display: flex; align-items: center; justify-content: center; padding: 24px;
}
.log-overlay[hidden] { display: none; }
.log-box {
    background: var(--karte); border: 1px solid var(--rand); border-radius: 10px;
    width: 100%; max-width: 920px; max-height: 82vh; display: flex; flex-direction: column;
}
.log-kopf { padding: 12px 16px; border-bottom: 1px solid var(--rand); display: flex; align-items: center; gap: 10px; }
.log-kopf strong { font-size: .9rem; }
.log-inhalt {
    margin: 0; padding: 14px 16px; overflow: auto; flex: 1;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .76rem; line-height: 1.55;
    white-space: pre-wrap; word-break: break-word; color: var(--gedaempft);
}

/* ── Tabellen ───────────────────────────────────────────────── */
table { width: 100%; border-collapse: collapse; font-size: .84rem; }
th {
    text-align: left; font-weight: 550; color: var(--leise); padding: 8px 10px;
    border-bottom: 1px solid var(--rand); font-size: .74rem;
    text-transform: uppercase; letter-spacing: .05em; white-space: nowrap;
}
td { padding: 9px 10px; border-bottom: 1px solid rgba(38,48,59,.55); vertical-align: top; }
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255,255,255,.018); }
.num { text-align: right; font-variant-numeric: tabular-nums; }
.tabelle-scroll { overflow-x: auto; }

/* ── Protokoll ──────────────────────────────────────────────── */
.filter { display: flex; gap: 7px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filter button {
    background: var(--bg-alt); border: 1px solid var(--rand); color: var(--gedaempft);
    padding: 5px 11px; border-radius: 20px; font-size: .78rem; cursor: pointer; font-family: inherit;
}
.filter button:hover { border-color: var(--rand-hell); color: var(--text); }
.filter button[aria-pressed="true"] { background: var(--akzent); border-color: var(--akzent); color: #1a1200; font-weight: 550; }
.suche {
    background: var(--bg-alt); border: 1px solid var(--rand); color: var(--text);
    padding: 6px 11px; border-radius: 7px; font-size: .82rem; font-family: inherit;
    min-width: 190px; margin-left: auto;
}
.suche:focus { outline: none; border-color: var(--akzent); }
.eintrag {
    display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid rgba(38,48,59,.55);
}
.eintrag:last-child { border-bottom: none; }
.e-links { flex-shrink: 0; width: 108px; }
.e-typ {
    display: inline-block; font-size: .66rem; font-weight: 600; letter-spacing: .04em;
    padding: 2px 7px; border-radius: 4px; background: var(--rand); color: var(--gedaempft);
}
.e-typ.ERRORS { background: rgba(248,81,73,.15); color: #ff8983; }
.e-typ.WARNINGS { background: rgba(210,153,34,.15); color: #e3b341; }
.e-typ.SYSTEM { background: rgba(88,166,255,.13); color: var(--blau); }
.e-typ.WATCHDOG, .e-typ.BOT-STATUS { background: rgba(163,113,247,.15); color: #bc8cff; }
.e-typ.BACKUP, .e-typ.SPEICHER { background: rgba(63,185,80,.13); color: #56d364; }
.e-typ.SICHERHEIT { background: rgba(248,81,73,.13); color: #ff8983; }
.e-typ.PURCHASE { background: rgba(240,180,41,.16); color: var(--akzent); }
.e-zeit { font-size: .7rem; color: var(--leise); margin-top: 4px; }
.e-rechts { min-width: 0; flex: 1; }
.e-titel { font-size: .87rem; font-weight: 550; margin-bottom: 2px; }
.e-text {
    font-size: .82rem; color: var(--gedaempft); white-space: pre-wrap;
    word-break: break-word; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: .77rem; line-height: 1.5;
}
.e-quelle { font-size: .7rem; color: var(--leise); margin-top: 4px; }
.mehr {
    background: none; border: none; color: var(--blau); font-size: .76rem;
    cursor: pointer; padding: 3px 0; font-family: inherit;
}

/* ── Sonstiges ──────────────────────────────────────────────── */
.leer { color: var(--leise); font-size: .85rem; padding: 22px; text-align: center; }
.pille { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: .72rem; font-weight: 550; }
.pille.auf { background: rgba(63,185,80,.14); color: #56d364; }
.pille.ab { background: rgba(248,81,73,.14); color: #ff8983; }
.anmeldung { max-width: 380px; margin: 15vh auto; text-align: center; padding: 36px 30px;
    background: var(--karte); border: 1px solid var(--rand); border-radius: 14px; }
.anmeldung h1 { font-size: 1.25rem; margin-bottom: 8px; }
.anmeldung p { color: var(--gedaempft); font-size: .88rem; margin-bottom: 22px; }
.anmeldung a {
    display: inline-block; background: #5865f2; color: #fff; padding: 10px 22px;
    border-radius: 8px; font-weight: 550; font-size: .9rem;
}
.anmeldung a:hover { background: #4752c4; text-decoration: none; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .78rem; }

@media (max-width: 860px) {
    .menu-knopf { display: inline-flex; align-items: center; justify-content: center; }
    .sidebar {
        position: fixed; left: 0; top: 0; transform: translateX(-100%);
        transition: transform .18s ease; box-shadow: 0 0 0 100vmax rgba(0,0,0,0);
    }
    .sidebar.offen { transform: translateX(0); box-shadow: 0 0 0 100vmax rgba(0,0,0,.5); }
    .topleiste { padding: 12px 16px; }
    .inhalt-bereich { padding: 18px 16px 48px; }
}
@media (max-width: 640px) {
    .e-links { width: 84px; }
    .kz-wert { font-size: 1.5rem; }
    .suche { margin-left: 0; width: 100%; }
}
</style>
</head>
<body>
<div id="app"></div>
<div class="log-overlay" id="log-overlay" hidden>
    <div class="log-box">
        <div class="log-kopf">
            <strong id="log-titel"></strong>
            <span class="neben" id="log-status" style="margin-left:6px"></span>
            <button class="knopf" id="log-aktualisieren" style="margin-left:auto">Aktualisieren</button>
            <button class="knopf" id="log-schliessen">Schließen</button>
        </div>
        <pre class="log-inhalt" id="log-inhalt">Lädt …</pre>
    </div>
</div>

<script>
(function () {
"use strict";

// ── Hilfsmittel ──────────────────────────────────────────────
function esc(s) {
    return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
// Erst maskieren, dann Auszeichnungen umsetzen - nie umgekehrt, sonst liesse
// sich ueber Log-Inhalte fremdes Markup einschleusen.
function escMd(s) {
    return esc(s)
        .replace(/```([\s\S]*?)```/g, function (_, i) { return "<code>" + i + "</code>"; })
        .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
        .replace(/`([^`]+)`/g, "<code>$1</code>");
}
function zahl(n) {
    if (n == null || isNaN(n)) return "–";
    return Number(n).toLocaleString("de-DE");
}
function relativ(iso) {
    if (!iso) return "–";
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if (isNaN(s)) return "–";
    if (s < 60) return "gerade eben";
    if (s < 3600) return Math.floor(s / 60) + " Min.";
    if (s < 86400) return Math.floor(s / 3600) + " Std.";
    return Math.floor(s / 86400) + " Tage";
}
function uhrzeit(iso) {
    if (!iso) return "–";
    var d = new Date(iso);
    if (isNaN(d)) return "–";
    var heute = new Date().toDateString() === d.toDateString();
    return heute
        ? d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" })
        : d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" }) + " " +
          d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
}

var zustand = { stats: null, logs: [], typen: [], zusammenfassung: null, filter: "", suche: "", blatt: "start", rolle: null };

function kannSchreiben() { return zustand.rolle === "owner" || zustand.rolle === "admin"; }

// ── Einstieg ─────────────────────────────────────────────────
async function start() {
    var ich;
    try { ich = await fetch("/api/me").then(function (r) { return r.json(); }); }
    catch (e) { ich = {}; }

    if (!ich || !ich.loggedIn) { anmeldungZeigen(); return; }
    zustand.rolle = ich.role;

    try {
        zustand.stats = await fetch("/api/stats").then(function (r) { return r.ok ? r.json() : null; });
    } catch (e) { zustand.stats = null; }

    geruestZeichnen(ich);
    await protokollLaden(true);
    blattZeichnen();

    // Protokoll haeufiger nachladen als die Statistik: Meldungen sind das,
    // weswegen man hier draufschaut. Die Container-Werte sammelt der Server
    // ohnehin nur alle paar Minuten ein.
    setInterval(function () { protokollLaden(false); }, 15000);
    setInterval(statistikLaden, 60000);
}

async function statistikLaden() {
    try {
        var neu = await fetch("/api/stats").then(function (r) { return r.ok ? r.json() : null; });
        // Neu zeichnen bei jedem Sammel-Durchlauf wuerde Formulareingaben auf anderen Seiten
        // (z.B. eine gerade getippte Discord-ID) zunichtemachen -- nur die Startseite (zeigt
        // direkt Stats/Alarme) und die Sidebar-Zaehler (Anzahl Produkte) haengen wirklich davon ab.
        if (neu) {
            zustand.stats = neu;
            if (zustand.blatt === "start") blattZeichnen();
            sidebarZeichnen();
        }
    } catch (e) { /* naechster Versuch in einer Minute */ }
}

function anmeldungZeigen() {
    document.getElementById("app").innerHTML =
        '<div class="anmeldung">' +
        '<h1>Dashboard</h1>' +
        '<p>Dieser Bereich ist privat. Bitte mit Discord anmelden.</p>' +
        '<a href="/auth/login">Mit Discord anmelden</a>' +
        '</div>';
}

// ── Geruest ──────────────────────────────────────────────────
var SEITEN_TITEL = {
    start: "Start", nutzer: "Nutzer-Suche", infrastruktur: "Infrastruktur",
    produkte: "Produkte", protokoll: "Protokoll", eselfriend: "EselFreund", zugriff: "Zugriff"
};

function geruestZeichnen(ich) {
    var name = esc((ich && ich.user && (ich.user.global_name || ich.user.username)) || "");
    document.getElementById("app").innerHTML =
        '<div class="app-schale">' +
            '<aside class="sidebar" id="sidebar">' +
                '<div class="sidebar-marke"><span>🐴</span> eselbande <span style="font-weight:400;color:var(--gedaempft);font-size:.85rem;margin-left:2px">Admin</span></div>' +
                '<nav class="sidebar-nav" id="sidebar-nav"></nav>' +
                '<div class="sidebar-fuss">' +
                    '<div class="zeile">' +
                        '<span class="puls"></span>' +
                        '<span>' + (name || "angemeldet") + "</span>" +
                        (zustand.rolle ? '<span class="rolle">' + esc(zustand.rolle) + "</span>" : "") +
                    "</div>" +
                    '<a class="knopf" href="/auth/logout" style="display:block;text-align:center">Abmelden</a>' +
                "</div>" +
            "</aside>" +
            '<div class="hauptbereich">' +
                '<div class="topleiste">' +
                    '<button class="menu-knopf" id="menu-knopf" aria-label="Menü">☰</button>' +
                    '<h1 id="seiten-titel">Start</h1>' +
                    '<span class="neben" id="aktualisiert">läuft</span>' +
                "</div>" +
                '<div class="inhalt-bereich" id="blatt"></div>' +
            "</div>" +
        "</div>";

    sidebarZeichnen();

    document.getElementById("menu-knopf").addEventListener("click", function () {
        document.getElementById("sidebar").classList.toggle("offen");
    });
    document.getElementById("app").addEventListener("click", function (e) {
        // Sidebar auf Mobil nach Auswahl automatisch schliessen.
        if (e.target.closest("#sidebar-nav button")) document.getElementById("sidebar").classList.remove("offen");
    });
}

function sidebarZeichnen() {
    var s = zustand.stats || {};
    var alarmAnzahl = startAlarme().length;
    var gruppen = [
        { titel: null, punkte: [
            { id: "start", text: "Start", ico: "🏠", zahl: alarmAnzahl || null, zahlWarn: true },
            { id: "nutzer", text: "Nutzer-Suche", ico: "🔍" },
        ] },
        { titel: "System", punkte: [
            { id: "infrastruktur", text: "Infrastruktur", ico: "🖥️" },
            { id: "produkte", text: "Produkte", ico: "📊", zahl: Object.keys(s.projects || {}).length },
            { id: "protokoll", text: "Protokoll", ico: "📜" },
        ] },
        { titel: "Bots", punkte: [
            { id: "eselfriend", text: "EselFreund", ico: "🤖" },
        ] },
    ];
    if (zustand.rolle === "owner") {
        gruppen.push({ titel: "Verwaltung", punkte: [{ id: "zugriff", text: "Zugriff", ico: "🔑" }] });
    }

    document.getElementById("sidebar-nav").innerHTML = gruppen.map(function (g) {
        return (g.titel ? '<div class="sidebar-gruppe">' + esc(g.titel) + "</div>" : "") +
            g.punkte.map(function (p) {
                return '<button data-blatt="' + p.id + '" aria-current="' + (zustand.blatt === p.id) + '">' +
                    '<span class="ico">' + p.ico + "</span><span>" + esc(p.text) + "</span>" +
                    (p.zahl ? '<span class="zahl"' + (p.zahlWarn ? ' style="background:rgba(248,81,73,.22);color:#ff8983"' : "") + '>' + p.zahl + "</span>" : "") +
                "</button>";
            }).join("");
    }).join("");

    document.getElementById("sidebar-nav").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-blatt]");
        if (!b) return;
        zustand.blatt = b.dataset.blatt;
        Array.prototype.forEach.call(this.querySelectorAll("button"), function (x) {
            x.setAttribute("aria-current", String(x.dataset.blatt === zustand.blatt));
        });
        document.getElementById("seiten-titel").textContent = SEITEN_TITEL[zustand.blatt] || "";
        blattZeichnen();
    });
}

// ── Kennzahlen ───────────────────────────────────────────────
function kennzahlenZeichnen() {
    var s = zustand.stats;
    var ziel = document.getElementById("kennzahlen");
    if (!ziel) return;

    var karten = [];

    if (s && s.containers) {
        var laufen = s.containers.filter(function (c) { return c.running; }).length;
        var gesamt = s.containers.length;
        var krank = s.containers.filter(function (c) { return c.running && c.health === "unhealthy"; }).length;
        var stufe = krank ? "warn" : (laufen === gesamt ? "gut" : "schlecht");
        karten.push({
            stufe: stufe, titel: "Container",
            wert: laufen + ' <small>/ ' + gesamt + "</small>",
            zusatz: krank ? krank + " ungesund" : (laufen === gesamt ? "alle laufen" : (gesamt - laufen) + " gestoppt")
        });
    }

    if (s && s.disk) {
        var p = Number(s.disk.used_pct) || 0;
        var st = p >= 90 ? "schlecht" : p >= 80 ? "warn" : "gut";
        karten.push({
            stufe: st, titel: "Speicher",
            wert: p.toFixed(1) + " <small>%</small>",
            zusatz: s.disk.free_gb + " GB frei von " + s.disk.total_gb + " GB",
            balken: { pct: p, klasse: st === "gut" ? "" : st }
        });
    }

    // Meldungen der letzten 24 Stunden. Bewusst aus der serverseitigen
    // Zaehlung: die geladene Liste ist auf 200 Eintraege begrenzt und wuerde
    // hier sonst einfach bei 200 stehenbleiben.
    var zf = zustand.zusammenfassung;
    if (zf) {
        var nachTyp = {};
        (zf.byType || []).forEach(function (t) { nachTyp[t.type] = t.count; });
        var fehler = nachTyp.ERRORS || 0;
        karten.push({
            stufe: fehler > 50 ? "schlecht" : fehler > 0 ? "warn" : "gut",
            titel: "Meldungen (24 Std.)",
            wert: zahl(zf.total),
            zusatz: fehler ? zahl(fehler) + " davon Fehler" : "keine Fehler"
        });
    }

    if (s && s.statuspage && s.statuspage.length) {
        var auf = s.statuspage.filter(function (x) { return x.up; }).length;
        karten.push({
            stufe: auf === s.statuspage.length ? "gut" : "warn",
            titel: "Dienste erreichbar",
            wert: auf + ' <small>/ ' + s.statuspage.length + "</small>",
            zusatz: "laut Statuspage"
        });
    }

    ziel.innerHTML = karten.map(function (k) {
        return '<div class="kz ' + k.stufe + '">' +
            '<div class="kz-titel">' + esc(k.titel) + "</div>" +
            '<div class="kz-wert">' + k.wert + "</div>" +
            '<div class="kz-zusatz">' + esc(k.zusatz) + "</div>" +
            (k.balken ? '<div class="balken"><i class="' + k.balken.klasse + '" style="width:' +
                Math.min(100, k.balken.pct) + '%"></i></div>' : "") +
            "</div>";
    }).join("");
}

// ── Blattwechsel ─────────────────────────────────────────────
function blattZeichnen() {
    var ziel = document.getElementById("blatt");
    if (!ziel) return;
    if (zustand.blatt === "protokoll") { ziel.innerHTML = protokollBlatt(); protokollVerdrahten(); protokollListe(); }
    else if (zustand.blatt === "produkte") ziel.innerHTML = diensteBlatt();
    else if (zustand.blatt === "infrastruktur") ziel.innerHTML = uebersichtBlatt();
    else if (zustand.blatt === "eselfriend") { ziel.innerHTML = eselfriendBlatt(); eselfriendVerdrahten(); eselfriendAiUsageLaden(); }
    else if (zustand.blatt === "nutzer") { ziel.innerHTML = nutzerBlatt(); nutzerVerdrahten(); }
    else if (zustand.blatt === "zugriff") { ziel.innerHTML = zugriffBlatt(); zugriffLaden(); }
    else { ziel.innerHTML = startBlatt(); kennzahlenZeichnen(); startVerdrahten(); }
}

// ── Start ────────────────────────────────────────────────────
function startAlarme() {
    var s = zustand.stats;
    var alarme = [];
    if (s && s.containers) {
        var gestoppt = s.containers.filter(function (c) { return !c.running; });
        var ungesund = s.containers.filter(function (c) { return c.running && c.health === "unhealthy"; });
        gestoppt.forEach(function (c) { alarme.push({ stufe: "schlecht", text: "Container " + c.name.replace(/-phase1$/, "") + " läuft nicht (" + c.status + ")." }); });
        ungesund.forEach(function (c) { alarme.push({ stufe: "warn", text: "Container " + c.name.replace(/-phase1$/, "") + " ist ungesund." }); });
        // Fruehwarnung: haeufige Neustarts sind oft ein Zeichen fuer einen Absturz-Loop, der sonst
        // erst auffaellt, wenn man es zufaellig bemerkt.
        s.containers.filter(function (c) { return c.running && Number(c.restart_count) >= 3; }).forEach(function (c) {
            alarme.push({ stufe: "warn", text: "Container " + c.name.replace(/-phase1$/, "") + " wurde " + c.restart_count + "× neu gestartet — evtl. instabil." });
        });
    }
    if (s && s.disk && Number(s.disk.used_pct) >= 80) {
        alarme.push({ stufe: Number(s.disk.used_pct) >= 90 ? "schlecht" : "warn", text: "Speicher zu " + Number(s.disk.used_pct).toFixed(1) + " % voll (" + s.disk.free_gb + " GB frei)." });
    }
    if (s && s.statuspage) {
        s.statuspage.filter(function (x) { return !x.up; }).forEach(function (x) {
            alarme.push({ stufe: "schlecht", text: x.service + " ist laut Statuspage nicht erreichbar." });
        });
    }
    var zf = zustand.zusammenfassung;
    if (zf) {
        var nachTyp = {};
        (zf.byType || []).forEach(function (t) { nachTyp[t.type] = t.count; });
        if ((nachTyp.ERRORS || 0) > 50) alarme.push({ stufe: "schlecht", text: zahl(nachTyp.ERRORS) + " Fehler in den letzten 24 Std. — deutlich mehr als üblich." });
    }
    return alarme;
}

function startBlatt() {
    var alarme = startAlarme();
    var html = '<div class="kennzahlen" id="kennzahlen"></div>';

    html += alarme.length
        ? '<div class="alarme">' + alarme.map(function (a) {
              return '<div class="alarm ' + a.stufe + '">⚠️ ' + esc(a.text) + "</div>";
          }).join("") + "</div>"
        : '<div class="alles-gut">✅ Alles läuft — keine offenen Probleme erkannt.</div>';

    html += '<div class="schnellzugriff">' +
        '<button data-blatt-sprung="nutzer">🔍 Nutzer suchen</button>' +
        '<button data-blatt-sprung="protokoll">📜 Protokoll ansehen</button>' +
        '<button data-blatt-sprung="infrastruktur">🖥️ Infrastruktur</button>' +
    "</div>";

    html += '<div class="start-raster">';

    html += '<div class="karte"><div class="karte-kopf"><h2>Letzte Aktivität</h2><span class="neben">' +
        '<a href="#" data-blatt-sprung="protokoll">alles ansehen →</a></span></div><div class="karte-koerper">';
    var letzte = zustand.logs.slice(0, 6);
    html += letzte.length
        ? letzte.map(function (l) {
              return '<div style="display:flex;gap:10px;padding:7px 0;border-bottom:1px solid rgba(38,48,59,.5);font-size:.84rem">' +
                  '<span class="e-typ ' + esc(l.type) + '" style="flex-shrink:0">' + esc(l.type) + "</span>" +
                  '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + escMd(l.title || l.description || "") + "</span>" +
                  '<span style="flex-shrink:0;color:var(--leise);font-size:.76rem">' + relativ(l.created_at) + "</span>" +
              "</div>";
          }).join("")
        : '<div class="leer">Noch keine Meldungen.</div>';
    html += "</div></div>";

    var p = (zustand.stats || {}).projects || {};

    function produktKarte(titel, kennzahlen) {
        return '<div class="karte"><div class="karte-kopf"><h2>' + esc(titel) + '</h2><span class="neben"><a href="#" data-blatt-sprung="produkte">Details →</a></span></div>' +
            '<div class="karte-koerper"><div style="display:flex;gap:28px;flex-wrap:wrap">' + kennzahlen + "</div></div></div>";
    }

    if (p.shop) {
        html += produktKarte("Shop",
            kennwert("Aktive Abos", zahl(p.shop.active_subscriptions)) +
            kennwert("Geschätzte MRR", p.shop.estimated_mrr_eur != null ? p.shop.estimated_mrr_eur.toFixed(2).replace(".", ",") + " €" : "–"));
    }
    if (p.fahrstuhl) {
        html += produktKarte("Fahrstuhl",
            kennwert("Premium-Server", zahl(p.fahrstuhl.premium_guilds)) +
            kennwert("Premium-Nutzer", zahl(p.fahrstuhl.premium_users)) +
            kennwert("Befehle gesamt", zahl(p.fahrstuhl.command_executions)));
    }
    if (p.eselmoderator) {
        html += produktKarte("EselModerator",
            kennwert("Server", zahl(p.eselmoderator.guilds)) +
            kennwert("Tickets offen", zahl(p.eselmoderator.tickets_open)) +
            kennwert("Mod-Fälle aktiv", zahl(p.eselmoderator.moderation_cases_active)));
    }
    if (p.eselbuilder) {
        html += produktKarte("Eselbuilder",
            kennwert("Aktive Abos", zahl(p.eselbuilder.active_subscriptions)) +
            kennwert("Gemini-Tokens heute", zahl(p.eselbuilder.gemini_tokens_today)));
    }
    if (p.umami) {
        html += produktKarte("Website",
            kennwert("Aufrufe heute", zahl(p.umami.pageviews_today)) +
            kennwert("Besucher (30 Tage)", zahl(p.umami.visitors_30d)));
    }

    html += "</div>";
    return html;
}

function startVerdrahten() {
    var ziel = document.getElementById("blatt");
    ziel.addEventListener("click", function (e) {
        var b = e.target.closest("[data-blatt-sprung]");
        if (!b) return;
        e.preventDefault();
        zustand.blatt = b.dataset.blattSprung;
        document.getElementById("seiten-titel").textContent = SEITEN_TITEL[zustand.blatt] || "";
        var navBtn = document.querySelector('#sidebar-nav button[data-blatt="' + zustand.blatt + '"]');
        Array.prototype.forEach.call(document.querySelectorAll("#sidebar-nav button"), function (x) {
            x.setAttribute("aria-current", String(x === navBtn));
        });
        blattZeichnen();
    });
}

// ── Übersicht ────────────────────────────────────────────────
function uebersichtBlatt() {
    var s = zustand.stats;
    if (!s) return '<div class="karte"><div class="leer">Noch keine Daten gesammelt. Der Sammler läuft alle paar Minuten auf dem Server — das Protokoll funktioniert unabhängig davon.</div></div>';

    var html = "";

    // Container
    var cs = (s.containers || []).slice().sort(function (a, b) {
        if (a.running !== b.running) return a.running ? 1 : -1;   // Probleme nach oben
        var ah = a.health === "unhealthy" ? 0 : 1, bh = b.health === "unhealthy" ? 0 : 1;
        if (ah !== bh) return ah - bh;
        return a.name.localeCompare(b.name);
    });
    html += '<div class="karte"><div class="karte-kopf"><h2>Container</h2>' +
        '<span class="neben">' + cs.filter(function (c) { return c.running; }).length + " von " + cs.length + " laufen</span></div>" +
        '<div class="karte-koerper"><div class="container-raster">' +
        cs.map(function (c) {
            var farbe = !c.running ? "rot" : c.health === "unhealthy" ? "gelb" : "gruen";
            var kurz = c.name.replace(/-phase1$/, "");
            var mem = c.mem_pct ? Math.round(Number(c.mem_pct)) + " %" : "";
            var titel = (c.image ? "Image: " + c.image + "\n" : "") +
                (c.ports && c.ports.length ? "Ports: " + c.ports.join(", ") + "\n" : "") +
                (c.created_at ? "Erstellt: " + uhrzeit(c.created_at) : "");
            return '<div class="cont" title="' + esc(titel) + '">' +
                '<span class="punkt ' + farbe + '"></span>' +
                '<div style="min-width:0">' +
                    '<div class="cont-name">' + esc(kurz) + "</div>" +
                    '<div class="cont-meta">' + esc(c.running ? (c.health || "läuft") : c.status) +
                    (c.running && c.started_at ? " · seit " + relativ(c.started_at) : "") +
                    (c.restart_count ? " · " + c.restart_count + "× neu" : "") + "</div>" +
                "</div>" +
                '<div class="cont-rechts">' + (c.running ? "CPU " + (c.cpu_pct || "0") + " %<br>RAM " + mem : "") + "</div>" +
                '<div class="cont-aktionen">' +
                    '<button data-docker-logs="' + esc(c.name) + '" title="Logs anzeigen">≡</button>' +
                    (kannSchreiben() ? (c.running
                        ? '<button data-docker-aktion="restart" data-docker-name="' + esc(c.name) + '" title="Neu starten">↻</button>' +
                          '<button data-docker-aktion="stop" data-docker-name="' + esc(c.name) + '" title="Stoppen">■</button>'
                        : '<button data-docker-aktion="start" data-docker-name="' + esc(c.name) + '" title="Starten">▶</button>') : "") +
                "</div>" +
            "</div>";
        }).join("") + "</div></div></div>";

    // Statuspage
    if (s.statuspage && s.statuspage.length) {
        var sp = s.statuspage.slice().sort(function (a, b) { return (a.up === b.up) ? a.service.localeCompare(b.service) : (a.up ? 1 : -1); });
        html += '<div class="karte"><div class="karte-kopf"><h2>Erreichbarkeit</h2>' +
            '<span class="neben">laut Statuspage</span></div><div class="tabelle-scroll"><table>' +
            "<thead><tr><th>Dienst</th><th>Status</th><th class='num'>Verfügbarkeit</th><th class='num'>Antwortzeit</th><th>Zuletzt geprüft</th></tr></thead><tbody>" +
            sp.map(function (x) {
                return "<tr><td>" + esc(x.service) + "</td>" +
                    '<td><span class="pille ' + (x.up ? "auf" : "ab") + '">' + (x.up ? "erreichbar" : "weg") + "</span></td>" +
                    '<td class="num">' + (x.uptime_pct != null ? Number(x.uptime_pct).toFixed(1) + " %" : "–") + "</td>" +
                    '<td class="num">' + (x.latency_ms != null ? x.latency_ms + " ms" : "–") + "</td>" +
                    "<td>" + relativ(x.last_check) + "</td></tr>";
            }).join("") + "</tbody></table></div></div>";
    }

    return html;
}

// ── Dienste ──────────────────────────────────────────────────
function tabelle(kopf, zeilen, leerText) {
    if (!zeilen || !zeilen.length) return '<div class="leer">' + esc(leerText || "Keine Daten.") + "</div>";
    return '<div class="tabelle-scroll"><table><thead><tr>' +
        kopf.map(function (h) { return "<th" + (h.num ? ' class="num"' : "") + ">" + esc(h.t || h) + "</th>"; }).join("") +
        "</tr></thead><tbody>" +
        zeilen.map(function (r) {
            return "<tr>" + r.map(function (z, i) {
                return "<td" + (kopf[i] && kopf[i].num ? ' class="num"' : "") + ">" + z + "</td>";
            }).join("") + "</tr>";
        }).join("") + "</tbody></table></div>";
}

function kennwert(label, wert) {
    return '<div><div class="kz-titel">' + esc(label) + '</div><div style="font-size:1.3rem;font-weight:600">' + esc(wert) + "</div></div>";
}

            kennwert("Tickets offen", zahl(em.tickets_open)) +
            kennwert("Mod-Faelle aktiv", zahl(em.moderation_cases_active)) +
            kennwert("Backups", zahl(em.backups)),
            tabelle([{ t: "Server-ID" }, { t: "Tickets", num: true }],
                (em.top_ticket_guilds || []).map(function (g) {
                    return ["<code>" + esc(g.guild_id) + "</code>", zahl(g.tickets)];
                }), "Noch keine Tickets."));
    }

    if (p.shop) {
        var sh = p.shop;
        html += block("Shop",
            kennwert("Aktive Abos", zahl(sh.active_subscriptions)) +
            kennwert("Geschätzte MRR", (sh.estimated_mrr_eur != null ? sh.estimated_mrr_eur.toFixed(2).replace(".", ",") + " €" : "–")) +
            kennwert("Codes eingelöst", zahl(sh.codes_redeemed_total)) +
            kennwert("Codes aktiv", zahl(sh.active_redemption_codes)),
            tabelle([{ t: "Produkt" }, { t: "Aktive Abos", num: true }],
                (sh.by_product || []).map(function (r) {
                    return [esc(r.product), zahl(r.active)];
                }), "Keine aktiven Abos.") +
            '<div class="e-quelle" style="margin-top:8px">MRR-Schätzung nur aus Produkten mit fest hinterlegtem Preis (EselModerator hat noch keinen Checkout-Preis).</div>');
    }

    if (p.umami) {
        var um = p.umami;
        html += block("Website-Analytics (Umami)",
            kennwert("Aufrufe heute", zahl(um.pageviews_today)) +
            kennwert("Aufrufe (7 Tage)", zahl(um.pageviews_7d)) +
            kennwert("Aufrufe (30 Tage)", zahl(um.pageviews_30d)) +
            kennwert("Besucher (30 Tage)", zahl(um.visitors_30d)),
            tabelle([{ t: "Seite" }, { t: "Aufrufe (7 Tage)", num: true }],
                (um.top_pages_7d || []).map(function (r) {
                    return ["<code>" + esc(r.path) + "</code>", zahl(r.views)];
                }), "Keine Aufrufe."));
    }

    return html || '<div class="karte"><div class="leer">Keine Projektdaten.</div></div>';
}

function protokollBlatt() {
    return '<div class="karte">' +
        '<div class="karte-kopf"><h2>Protokoll</h2><span class="neben" id="log-anzahl"></span></div>' +
        '<div class="karte-koerper">' +
            '<div class="filter" id="log-filter"></div>' +
            '<div id="log-liste"><div class="leer">Lädt …</div></div>' +
        "</div></div>";
}

function protokollVerdrahten() {
    var f = document.getElementById("log-filter");
    if (!f) return;

    var knoepfe = '<button data-typ="" aria-pressed="' + (zustand.filter === "") + '">Alle</button>' +
        zustand.typen.map(function (t) {
            return '<button data-typ="' + esc(t.type) + '" aria-pressed="' + (zustand.filter === t.type) + '">' +
                esc(t.type) + " <span class='zahl'>" + t.count + "</span></button>";
        }).join("");
    f.innerHTML = knoepfe + '<input class="suche" id="log-suche" type="search" placeholder="Durchsuchen …" value="' + esc(zustand.suche) + '">';

    f.addEventListener("click", function (e) {
        var b = e.target.closest("button[data-typ]");
        if (!b) return;
        zustand.filter = b.dataset.typ;
        Array.prototype.forEach.call(f.querySelectorAll("button[data-typ]"), function (x) {
            x.setAttribute("aria-pressed", String(x.dataset.typ === zustand.filter));
        });
        protokollListe();
    });

    var suche = document.getElementById("log-suche");
    var timer;
    suche.addEventListener("input", function () {
        clearTimeout(timer);
        timer = setTimeout(function () { zustand.suche = suche.value.trim().toLowerCase(); protokollListe(); }, 200);
    });
}

async function protokollLaden(erst) {
    try {
        var typen = await fetch("/api/logs/types").then(function (r) { return r.ok ? r.json() : []; });
        zustand.typen = (Array.isArray(typen) ? typen : (typen.types || [])).filter(function (t) { return t && t.type; });
    } catch (e) { /* Filter bleiben wie sie sind */ }

    try {
        zustand.zusammenfassung = await fetch("/api/logs/summary?hours=24")
            .then(function (r) { return r.ok ? r.json() : null; });
    } catch (e) { /* Kennzahl bleibt beim letzten Stand */ }

    try {
        var antwort = await fetch("/api/logs?limit=200").then(function (r) { return r.ok ? r.json() : null; });
        var liste = Array.isArray(antwort) ? antwort : (antwort && antwort.logs) || [];
        zustand.logs = liste;
    } catch (e) { /* naechster Durchlauf */ }

    var a = document.getElementById("aktualisiert");
    if (a) a.textContent = "aktualisiert " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });

    kennzahlenZeichnen();
    if (!erst && zustand.blatt === "protokoll") { protokollVerdrahten(); protokollListe(); }
}

function protokollListe() {
    var ziel = document.getElementById("log-liste");
    if (!ziel) return;

    var liste = zustand.logs.filter(function (l) {
        if (zustand.filter && l.type !== zustand.filter) return false;
        if (zustand.suche) {
            var heu = ((l.title || "") + " " + (l.description || "") + " " + (l.source || "")).toLowerCase();
            if (heu.indexOf(zustand.suche) === -1) return false;
        }
        return true;
    });

    var z = document.getElementById("log-anzahl");
    if (z) z.textContent = liste.length + " von " + zustand.logs.length + " Einträgen";

    if (!liste.length) { ziel.innerHTML = '<div class="leer">Keine passenden Einträge.</div>'; return; }

    ziel.innerHTML = liste.map(function (l) {
        var text = String(l.description || "");
        var lang = text.length > 300;
        var kurz = lang ? text.slice(0, 300) + " …" : text;
        return '<div class="eintrag">' +
            '<div class="e-links">' +
                '<span class="e-typ ' + esc(l.type) + '">' + esc(l.type) + "</span>" +
                '<div class="e-zeit">' + uhrzeit(l.created_at) + "</div>" +
            "</div>" +
            '<div class="e-rechts">' +
                (l.title ? '<div class="e-titel">' + escMd(l.title) + "</div>" : "") +
                '<div class="e-text" data-kurz="' + esc(kurz) + '" data-lang="' + esc(text) + '">' + escMd(kurz) + "</div>" +
                (lang ? '<button class="mehr" data-auf="0">mehr anzeigen</button>' : "") +
                '<div class="e-quelle">' + esc(l.source || "") + "</div>" +
            "</div>" +
        "</div>";
    }).join("");
}

async function eselfriendVoiceSuchen() {
    var eingabe = document.getElementById("ef-discord-id");
    var discordId = eingabe.value.trim();
    var ziel = document.getElementById("ef-ergebnis");
    if (!discordId) { ziel.innerHTML = '<div class="leer">Bitte eine Discord-ID eingeben.</div>'; return; }

    ziel.innerHTML = '<div class="leer">Lädt …</div>';
    try {
        var res = await fetch("/api/eselbuilder/voice-limit?discordId=" + encodeURIComponent(discordId));
        var daten = await res.json();
        if (!res.ok) { ziel.innerHTML = '<div class="leer">' + esc(daten.error || "Nicht gefunden.") + "</div>"; return; }
        efZustand.ergebnis = daten;
        efZustand.discordId = discordId;
        eselfriendErgebnisZeichnen();
    } catch (e) {
        ziel.innerHTML = '<div class="leer">Anfrage fehlgeschlagen.</div>';
    }
}

function eselfriendErgebnisZeichnen() {
    var ziel = document.getElementById("ef-ergebnis");
    var d = efZustand.ergebnis;
    if (!ziel || !d) return;

    var voiceMin = Math.floor(d.voiceUsedSeconds / 60) + " / " + Math.floor(d.voiceLimitSeconds / 60) + " Min.";
    ziel.innerHTML =
        '<div style="display:flex;gap:32px;flex-wrap:wrap;margin-bottom:16px">' +
            kennwert("Nutzer", d.username || d.discordId) +
            kennwert("Tarif", d.premium ? "Eselbuilder Pro" : "Kostenlos") +
            kennwert("Voice (Monat)", voiceMin) +
            kennwert("Nachrichten (heute)", d.textUsedMessages + " / " + d.textLimitMessages) +
            kennwert("Aktueller Override", d.voiceLimitOverrideMinutes != null ? d.voiceLimitOverrideMinutes + " Min." : "keiner") +
        "</div>" +
        (kannSchreiben() ?
            '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
                '<input class="suche" id="ef-neues-limit" type="number" min="0" step="1" placeholder="Neues Limit in Minuten" style="margin-left:0;min-width:220px">' +
                '<button class="knopf" id="ef-limit-setzen">Setzen</button>' +
                '<button class="knopf" id="ef-limit-entfernen">Override entfernen</button>' +
            "</div>" +
            '<div id="ef-limit-status" style="margin-top:10px;font-size:.82rem;color:var(--gedaempft)"></div>'
        : "");

    if (!kannSchreiben()) return;

    document.getElementById("ef-limit-setzen").addEventListener("click", function () {
        var eingabe = document.getElementById("ef-neues-limit");
        var wert = Number(eingabe.value);
        if (!eingabe.value || isNaN(wert) || wert < 0) {
            document.getElementById("ef-limit-status").textContent = "Bitte eine gültige Zahl >= 0 eingeben.";
            return;
        }
        eselfriendLimitSpeichern(Math.round(wert));
    });
    document.getElementById("ef-limit-entfernen").addEventListener("click", function () {
        eselfriendLimitSpeichern(null);
    });
}

async function eselfriendLimitSpeichern(minutesLimit) {
    var status = document.getElementById("ef-limit-status");
    status.textContent = "Speichere …";
    try {
        var res = await fetch("/api/eselbuilder/voice-limit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ discordId: efZustand.discordId, minutesLimit: minutesLimit })
        });
        var daten = await res.json();
        if (!res.ok) { status.textContent = "Fehler: " + (daten.error || res.status); return; }
        status.textContent = minutesLimit == null ? "Override entfernt." : "Limit auf " + minutesLimit + " Min. gesetzt.";
        await eselfriendVoiceSuchen();
    } catch (e) {
        status.textContent = "Anfrage fehlgeschlagen.";
    }
}

// Discord-IDs sind Snowflakes: die oberen Bits kodieren den Erstellungs-Zeitpunkt relativ zu
// Discords eigener Epoche (2015-01-01) -- kein API-Aufruf noetig, laesst sich lokal berechnen.
function discordKontoSeit(discordId) {
    try {
        var ms = Number((BigInt(discordId) >> 22n) + 1420070400000n);
        return new Date(ms).toLocaleDateString("de-DE", { year: "numeric", month: "long", day: "numeric" });
    } catch (e) { return null; }
}

function nutzerErgebnisHtml(d) {
    var html = "";
    var name = (d.discord && (d.discord.globalName || d.discord.username)) ||
        (d.shop && d.shop.user && d.shop.user.username) || null;
    var kontoSeit = discordKontoSeit(d.discordId);

    html += '<div style="display:flex;align-items:center;gap:16px;margin-bottom:18px">' +
        (d.discord && d.discord.avatarUrl
            ? '<img src="' + esc(d.discord.avatarUrl) + '" alt="" style="width:56px;height:56px;border-radius:50%;flex-shrink:0;background:var(--bg-alt)">'
            : "") +
        '<div style="display:flex;gap:32px;flex-wrap:wrap">' +
            kennwert(name ? "Name" : "Discord-ID", name || d.discordId) +
            (name ? kennwert("Discord-ID", d.discordId) : "") +
            (d.discord && d.discord.username && d.discord.globalName ? kennwert("Nutzername", "@" + d.discord.username) : "") +
            (kontoSeit ? kennwert("Discord-Konto seit", kontoSeit) : "") +
        "</div>" +
    "</div>";

    // Shop
    var SPERRBARE_PRODUKTE = ["fahrstuhl_basic", "fahrstuhl_pro", "eselbuilder_pro", "eselmoderator_basic", "eselmoderator_pro"];
    html += '<div class="kz-titel" style="margin-bottom:8px">Shop-Bestellungen</div>';
    if (d.shop && d.shop.orders && d.shop.orders.length) {
        var kopf = [{ t: "Produkt" }, { t: "Status" }, { t: "Läuft bis" }, { t: "Erstellt" }];
        if (kannSchreiben()) kopf.push({ t: "" });
        html += tabelle(kopf,
            d.shop.orders.map(function (o) {
                var aktiv = o.status === "active";
                var zeile = [
                    esc(PRODUKT_NAMEN[o.productKey] || o.productKey),
                    '<span class="pille ' + (aktiv ? "auf" : "ab") + '">' + esc(o.status) + "</span>",
                    o.currentPeriodEnd ? uhrzeit(o.currentPeriodEnd) : "–",
                    uhrzeit(o.createdAt)
                ];
                if (kannSchreiben()) {
                    zeile.push(SPERRBARE_PRODUKTE.indexOf(o.productKey) === -1 ? "" :
                        '<button class="knopf" data-shop-sperren="' + esc(o.productKey) + '" data-shop-locked="' + (aktiv ? "1" : "0") + '">' +
                            (aktiv ? "Sperren" : "Entsperren") +
                        "</button>");
                }
                return zeile;
            }));
        html += '<div id="nu-shop-status" style="margin-top:8px;font-size:.82rem;color:var(--gedaempft)"></div>';
    } else {
        html += '<div class="leer">Keine Bestellungen im Shop gefunden.</div>';
    }

    // Fahrstuhl
    html += '<div class="kz-titel" style="margin:18px 0 8px">Fahrstuhl</div>';
    if (d.fahrstuhl) {
        html += '<div style="display:flex;gap:32px;flex-wrap:wrap">' +
            kennwert("Premium", d.fahrstuhl.isPremium ? (d.fahrstuhl.isPro ? "Pro" : "Ja") : "Nein") +
            (d.fahrstuhl.user && d.fahrstuhl.user.expires_at ? kennwert("Läuft ab", uhrzeit(d.fahrstuhl.user.expires_at)) : "") +
        "</div>";
    } else {
        html += '<div class="leer">Kein Fahrstuhl-Premium oder Dienst nicht erreichbar.</div>';
    }

    // Eselbuilder / EselFreund
    html += '<div class="kz-titel" style="margin:18px 0 8px">Eselbuilder / EselFreund</div>';
    if (d.eselbuilder) {
        var eb = d.eselbuilder;
        html += '<div style="display:flex;gap:32px;flex-wrap:wrap">' +
            kennwert("Tarif", eb.premium ? "Eselbuilder Pro" : "Kostenlos") +
            kennwert("Voice (Monat)", Math.floor(eb.voiceUsedSeconds / 60) + " / " + Math.floor(eb.voiceLimitSeconds / 60) + " Min.") +
            kennwert("Nachrichten (heute)", eb.textUsedMessages + " / " + eb.textLimitMessages) +
            (eb.voiceLimitOverrideMinutes != null ? kennwert("Voice-Override", eb.voiceLimitOverrideMinutes + " Min.") : "") +
        "</div>";
    } else {
        html += '<div class="leer">Kein Eselbuilder-Konto gefunden.</div>';
    }

    // EselModerator
    html += '<div class="kz-titel" style="margin:18px 0 8px">EselModerator</div>';
    if (d.eselmoderator) {
        var em = d.eselmoderator;
        html += '<div style="display:flex;gap:32px;flex-wrap:wrap;margin-bottom:12px">' +
            kennwert("Premium", em.isPremium ? (em.isPro ? "Pro" : "Ja") : "Nein") +
            (em.user && em.user.expires_at ? kennwert("Läuft ab", uhrzeit(em.user.expires_at)) : "") +
        "</div>";
    } else {
        html += '<div class="leer" style="margin-bottom:12px">Kein EselModerator-Premium.</div>';
    }
    if (kannSchreiben()) {
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
                '<select id="nu-em-tier" class="suche" style="margin-left:0">' +
                    '<option value="basic">Basic</option><option value="pro">Pro</option>' +
                "</select>" +
                '<input class="suche" id="nu-em-tage" type="number" min="1" value="35" style="width:100px" title="Tage gueltig">' +
                '<button class="knopf" data-em-aktion="activate">Setzen</button>' +
                '<button class="knopf" data-em-aktion="deactivate">Entfernen</button>' +
            "</div>" +
            '<div id="nu-em-status" style="margin-top:8px;font-size:.82rem;color:var(--gedaempft)"></div>';
    }

    // EselTokens (manuelle Gutschrift, siehe README Abschnitt zur PayPal-Freunde&Familie-Zahlung)
    html += '<div class="kz-titel" style="margin:18px 0 8px">EselTokens</div>';
    if (kannSchreiben()) {
        html += '<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">' +
                '<input class="suche" id="nu-et-menge" type="number" min="1" max="50000" placeholder="Anzahl Tokens" style="width:160px">' +
                '<button class="knopf" data-et-aktion="credit">Gutschreiben</button>' +
            "</div>" +
            '<div id="nu-et-status" style="margin-top:8px;font-size:.82rem;color:var(--gedaempft)"></div>';
    }

    return html;
}

async function eseltokensGutschreiben() {
    var status = document.getElementById("nu-et-status");
    var mengeInput = document.getElementById("nu-et-menge");
    var menge = Number(mengeInput.value);
    if (!menge || menge <= 0) { status.textContent = "Bitte eine gültige Anzahl eingeben."; return; }
    status.textContent = "Speichere …";
    try {
        var res = await fetch("/api/eseltokens/credit", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                discordId: nutzerZustand.discordId,
                username: nutzerZustand.username,
                amount: menge,
                reason: "Manuelle Admin-Gutschrift (PayPal)"
            })
        });
        var daten = await res.json();
        if (!res.ok) { status.textContent = "Fehler: " + (daten.error || res.status); return; }
        status.textContent = menge + " Tokens gutgeschrieben. Neuer Kontostand: " + daten.newBalance;
        mengeInput.value = "";
    } catch (e) {
        status.textContent = "Anfrage fehlgeschlagen.";
    }
}

async function eselmoderatorPremiumSetzen(aktion) {
    var status = document.getElementById("nu-em-status");
    status.textContent = "Speichere …";
    try {
        var res = await fetch("/api/eselmoderator/premium", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                discordId: nutzerZustand.discordId,
                action: aktion,
                tier: document.getElementById("nu-em-tier").value,
                daysValid: Number(document.getElementById("nu-em-tage").value) || 35
            })
        });
        var daten = await res.json();
        if (!res.ok) { status.textContent = "Fehler: " + (daten.error || res.status); return; }
        status.textContent = aktion === "deactivate" ? "Premium entfernt." : "Premium gesetzt.";
        await nutzerSuchen();
    } catch (e) {
        status.textContent = "Anfrage fehlgeschlagen.";
    }
}

async function shopSperren(productKey, warAktiv) {
    var neuGesperrt = warAktiv; // "Sperren" geklickt -> war aktiv -> jetzt sperren (locked:true)
    if (!confirm((neuGesperrt ? "Zugriff für " : "Zugriff wieder freigeben für ") + (PRODUKT_NAMEN[productKey] || productKey) + "?")) return;
    var status = document.getElementById("nu-shop-status");
    if (status) status.textContent = "Speichere …";
    try {
        var res = await fetch("/api/shop/lock-order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ discordId: nutzerZustand.discordId, productKey: productKey, locked: neuGesperrt })
        });
        var daten = await res.json();
        if (!res.ok) { if (status) status.textContent = "Fehler: " + (daten.error || res.status); return; }
        await nutzerSuchen();
    } catch (e) {
        if (status) status.textContent = "Anfrage fehlgeschlagen.";
    }
}

// ── Docker-Steuerung ─────────────────────────────────────────
var logZustand = { name: null };

function logModalOeffnen(name) {
    logZustand.name = name;
    document.getElementById("log-titel").textContent = name;
    document.getElementById("log-status").textContent = "";
    document.getElementById("log-inhalt").textContent = "Lädt …";
    document.getElementById("log-overlay").hidden = false;
    logModalLaden();
}

async function logModalLaden() {
    var name = logZustand.name;
    if (!name) return;
    var status = document.getElementById("log-status");
    var inhalt = document.getElementById("log-inhalt");
    status.textContent = "lädt …";
    try {
        var res = await fetch("/api/docker/containers/" + encodeURIComponent(name) + "/logs?tail=400");
        var text = await res.text();
        if (!res.ok) { inhalt.textContent = "Fehler: " + text; status.textContent = ""; return; }
        inhalt.textContent = text || "(keine Logs)";
        inhalt.scrollTop = inhalt.scrollHeight;
        status.textContent = "aktualisiert " + new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
    } catch (e) {
        inhalt.textContent = "Anfrage fehlgeschlagen.";
        status.textContent = "";
    }
}

document.getElementById("log-schliessen").addEventListener("click", function () {
    document.getElementById("log-overlay").hidden = true;
    logZustand.name = null;
});
document.getElementById("log-aktualisieren").addEventListener("click", logModalLaden);
document.getElementById("log-overlay").addEventListener("click", function (e) {
    if (e.target.id === "log-overlay") { document.getElementById("log-overlay").hidden = true; logZustand.name = null; }
});

var DOCKER_AKTION_TEXT = { restart: "neu starten", stop: "stoppen", start: "starten" };
async function dockerAktionAusfuehren(btn, name, aktion) {
    if ((aktion === "stop" || aktion === "restart") && !confirm(name + " wirklich " + DOCKER_AKTION_TEXT[aktion] + "?")) return;
    var alle = btn.parentElement.querySelectorAll("button");
    Array.prototype.forEach.call(alle, function (b) { b.disabled = true; });
    try {
        var res = await fetch("/api/docker/containers/" + encodeURIComponent(name) + "/" + aktion, { method: "POST" });
        var daten = await res.json().catch(function () { return {}; });
        if (!res.ok) { alert("Fehler: " + (daten.error || res.status)); }
        setTimeout(statistikLaden, 1500); // Container braucht kurz, bis der naechste Sammel-Durchlauf den neuen Status sieht
    } catch (e) {
        alert("Anfrage fehlgeschlagen.");
    } finally {
        Array.prototype.forEach.call(alle, function (b) { b.disabled = false; });
    }
}

document.addEventListener("click", function (e) {
    var logBtn = e.target.closest("[data-docker-logs]");
    if (logBtn) { logModalOeffnen(logBtn.dataset.dockerLogs); return; }
    var aktionBtn = e.target.closest("[data-docker-aktion]");
    if (aktionBtn) { dockerAktionAusfuehren(aktionBtn, aktionBtn.dataset.dockerName, aktionBtn.dataset.dockerAktion); return; }
    var emBtn = e.target.closest("[data-em-aktion]");
    if (emBtn) { eselmoderatorPremiumSetzen(emBtn.dataset.emAktion); return; }
    var etBtn = e.target.closest("[data-et-aktion]");
    if (etBtn) { eseltokensGutschreiben(); return; }
    var shopBtn = e.target.closest("[data-shop-sperren]");
    if (shopBtn) { shopSperren(shopBtn.dataset.shopSperren, shopBtn.dataset.shopLocked === "1"); return; }
});

// Ein einziger Zuhoerer statt einer je Eintrag - die Liste wird alle 15
// Sekunden neu gezeichnet, einzelne Zuhoerer wuerden sich sonst ansammeln.
document.addEventListener("click", function (e) {
    var b = e.target.closest(".mehr");
    if (!b) return;
    var text = b.parentElement.querySelector(".e-text");
    var auf = b.dataset.auf === "1";
    text.innerHTML = escMd(auf ? text.dataset.kurz : text.dataset.lang);
    b.dataset.auf = auf ? "0" : "1";
    b.textContent = auf ? "mehr anzeigen" : "weniger anzeigen";
});

start();
})();
